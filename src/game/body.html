<div id="app">
  <div id="stage"><canvas id="map"></canvas>
    <div id="wins"></div>
    <div id="zoom" class="glass"><button id="zin" aria-label="Zoom in"></button><button id="zout" aria-label="Zoom out"></button><button id="bmm" aria-label="Show or hide the minimap"></button></div>
    <canvas id="minimap" class="glass" aria-label="Minimap. Tap to move the view."></canvas>
    <div id="tut" class="glass" hidden></div>
    <div id="hint" class="glass"></div><div id="toast"></div>
    <div id="gameover" hidden><div class="endbox"><h2>Bankrupt</h2><p>Your company ran out of money.</p><button class="gb big" id="go-new">New game</button></div></div>
  </div>
  <header id="topbar" class="glass">
    <div class="tb-row">
      <div class="tb-co"><i class="logo"></i><div class="tb-txt"><b id="scompany">—</b><span id="sdate">—</span></div></div>
      <div id="smoney">£0</div>
      <div class="speed"><button id="bpause" class="ib" aria-label="Pause or play"></button><button class="ib spd on" data-s="1">1×</button><button class="ib spd" data-s="2">2×</button><button class="ib spd" data-s="4">4×</button></div>
    </div>
    <nav id="bar">
      <button id="bshop" class="nb" data-i="buy">Buy</button><button id="bfleet" class="nb" data-i="fleet">Fleet</button><button id="bfin" class="nb" data-i="money">Money</button><button id="bgraph" class="nb" data-i="graphs">Graphs</button><button id="bco" class="nb" data-i="company">Company</button><button id="bnews" class="nb" data-i="news">News</button><button id="brace" class="nb" data-i="race" hidden>Race</button><button id="bhelp" class="nb" data-i="help" aria-label="Keys and help">Help</button><button id="bmenu" class="nb" data-i="menu">Menu</button>
    </nav>
  </header>
  <div id="ticker" class="glass info" role="button"></div>
  <div id="tools" class="glass"></div>
  <div id="menu" hidden></div>
</div>
