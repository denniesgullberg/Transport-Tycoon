<title>Transport &amp; Co.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>/* Transport & Co. — floating glass panels over a full-screen map. Light and dark follow the system. */
:root{
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --glass:rgba(250,251,253,.80);--glass-strong:rgba(255,255,255,.94);--raise:rgba(16,24,40,.05);--raise2:rgba(16,24,40,.09);
  --line:rgba(16,24,40,.10);--line2:rgba(16,24,40,.18);--ink:#141c27;--dim:#5d6878;--faint:#8b95a3;
  --accent:#f5b301;--accent-ink:#1f1700;--accent-soft:rgba(245,179,1,.16);
  --good:#178a4f;--bad:#d2382e;--warnc:#b77900;--info:#2f7de1;
  --green:var(--good);--red:var(--bad);
  --shadow:0 8px 28px rgba(15,23,42,.18),0 1px 3px rgba(15,23,42,.10);
  --radius:16px;--r-sm:10px;--blur:saturate(160%) blur(14px);
  --sheet-handle:rgba(16,24,40,.22);--map-bg:#203018;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glass:rgba(20,25,33,.78);--glass-strong:rgba(26,32,42,.96);--raise:rgba(255,255,255,.06);--raise2:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.17);--ink:#eef2f6;--dim:#a2adbb;--faint:#76818f;
  --accent-soft:rgba(245,179,1,.18);--good:#3fcf86;--bad:#ff6b61;--warnc:#ffc23d;--info:#6aaeff;
  --shadow:0 10px 32px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);--sheet-handle:rgba(255,255,255,.25);--map-bg:#0e140c;color-scheme:dark}}
:root[data-theme="dark"]{
  --glass:rgba(20,25,33,.78);--glass-strong:rgba(26,32,42,.96);--raise:rgba(255,255,255,.06);--raise2:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.17);--ink:#eef2f6;--dim:#a2adbb;--faint:#76818f;
  --accent-soft:rgba(245,179,1,.18);--good:#3fcf86;--bad:#ff6b61;--warnc:#ffc23d;--info:#6aaeff;
  --shadow:0 10px 32px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);--sheet-handle:rgba(255,255,255,.25);--map-bg:#0e140c;color-scheme:dark}

html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--map-bg);color:var(--ink);font:14px/1.4 var(--font);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--map-bg)}
#map{display:block;touch-action:none}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}
.ic{display:block;flex:none}

/* top bar */
#topbar{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));border-radius:var(--radius);padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.tb-row{display:flex;align-items:center;gap:8px;min-width:0}
.tb-co{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.logo{width:30px;height:30px;border-radius:9px;flex:none;background:linear-gradient(135deg,#ffcf3f,#f59e0b);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);position:relative}
.logo::after{content:"";position:absolute;inset:8px 7px;border:2.5px solid #1f1700;border-top:0;border-radius:0 0 4px 4px}
.tb-txt{display:flex;flex-direction:column;min-width:0;line-height:1.15}.tb-txt b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb-txt span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
#smoney{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:999px;background:var(--raise);white-space:nowrap}#smoney.neg{color:var(--bad)}
.speed{display:flex;gap:2px;padding:2px;border-radius:12px;background:var(--raise)}
.ib{min-width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-weight:650;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ib:hover{background:var(--raise2)}.ib.on{background:var(--accent);color:var(--accent-ink)}
#bar{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -2px}#bar::-webkit-scrollbar{display:none}
.nb{flex:1 0 auto;min-width:42px;min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 4px;font-size:10.5px;font-weight:550}
.nb .ic{width:20px;height:20px}.nb span{color:var(--dim);white-space:nowrap}.nb:hover{background:var(--raise2)}.nb:active{transform:scale(.96)}
.nb[hidden]{display:none}

/* bottom tool dock */
#tools{position:absolute;z-index:6;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);border-radius:var(--radius);padding:5px;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;overscroll-behavior:contain}
#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;width:60px;min-height:52px;border:0;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;font-size:10.5px;font-weight:550;line-height:1.1}
.tool span{color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tool:hover{background:var(--raise2)}.tool:active{transform:scale(.95)}
.tool.on{background:var(--accent);color:var(--accent-ink)}.tool.on span{color:var(--accent-ink)}
.tool.undo:disabled{opacity:.4}
.tsep{flex:none;width:1px;height:32px;background:var(--line2);margin:0 3px}

/* overlays that keep clear of the bars */
#ticker{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(var(--dockh,80px) + 8px);max-width:min(560px,calc(100% - 120px));padding:7px 14px 7px 12px;border-radius:999px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center;gap:8px}
#ticker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--info);flex:none}#ticker.bad::before{background:var(--bad)}#ticker.good::before{background:var(--good)}#ticker:empty{display:none}
#hint{position:absolute;z-index:4;left:max(8px,env(safe-area-inset-left,0px));right:62px;bottom:calc(var(--dockh,80px) + 48px);padding:7px 11px;border-radius:12px;font-size:12px;color:var(--dim);pointer-events:none;max-width:520px}
#hint:empty{display:none}
#zoom{position:absolute;z-index:4;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--dockh,80px) + 48px);display:flex;flex-direction:column;border-radius:14px;padding:3px;gap:2px}
#zoom button{width:38px;height:38px;border:0;border-radius:11px;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}#zoom button:hover{background:var(--raise2)}
#minimap{position:absolute;z-index:4;right:max(8px,env(safe-area-inset-right,0px));top:calc(var(--toph,110px) + 8px);border-radius:14px;padding:0;touch-action:none;cursor:crosshair}#minimap[hidden]{display:none}
#tut{position:absolute;z-index:5;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:calc(var(--toph,110px) + 8px);border-radius:14px;padding:10px 12px;font-size:13px;max-width:520px;border-left:4px solid var(--accent)}#tut[hidden]{display:none}
body.mm-on #tut{right:136px}
.tut-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px}.tut-h button{border:0;background:var(--raise2);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:32px;font-weight:600;font-size:12px}
#toast{position:absolute;z-index:60;top:calc(var(--toph,110px) + 10px);left:50%;transform:translate(-50%,-12px);opacity:0;background:var(--glass-strong);color:var(--ink);padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);border:1px solid var(--line);max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;pointer-events:none;text-align:center;font-weight:550;font-size:13px}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--bad);color:#fff;border-color:transparent}
#gameover{position:absolute;inset:0;background:rgba(5,8,12,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:60}#gameover[hidden]{display:none}

/* windows: floating cards on wide screens, sheets from the bottom on phones */
#wins{position:absolute;inset:0;pointer-events:none;z-index:7}
.win{position:absolute;width:min(380px,calc(100% - 16px));max-height:calc(100% - var(--toph,110px) - var(--dockh,80px) - 16px);display:flex;flex-direction:column;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);pointer-events:auto;overflow:hidden;animation:winIn .18s ease-out}
@keyframes winIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.wtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 8px 8px 16px;font-weight:700;font-size:15px;cursor:move;touch-action:none;position:relative}
.wtitle span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx{flex:none;border:0;background:var(--raise2);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wbody{padding:2px 16px 16px;overflow:auto;overscroll-behavior:contain;min-height:0;font-size:13px}
.win.wide{width:min(480px,calc(100% - 16px))}
@media (max-width:640px){
  .win,.win.wide{left:0!important;right:0;top:auto!important;bottom:0;width:100%;max-height:min(76%,calc(100% - var(--toph,110px) - 4px));border-radius:22px 22px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);animation:sheetIn .24s cubic-bezier(.2,.8,.2,1)}
  .wtitle{cursor:grab;padding-top:18px}
  .wtitle::before{content:"";position:absolute;left:50%;top:7px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--sheet-handle)}
}
@keyframes sheetIn{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}

/* content */
h4{margin:16px 0 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}h3{margin:14px 0 6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--dim)}.kv b{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}
.neg{color:var(--bad)!important}.dim{color:var(--dim)}.warn{color:var(--bad);font-weight:600;margin:8px 0;padding:8px 10px;background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:10px}
.gb{background:var(--raise2);border:0;border-radius:11px;color:var(--ink);font:inherit;font-weight:620;padding:8px 14px;cursor:pointer;min-height:36px;transition:background .15s,transform .1s}
.gb:hover{background:var(--line2)}.gb:active{transform:scale(.97)}.gb:disabled{opacity:.45;cursor:default;transform:none}
.gb.sm{min-height:34px;padding:5px 11px;font-size:12.5px}.gb.sq{min-width:38px;padding:6px}
.gb.on,.gb.go{background:var(--accent);color:var(--accent-ink)}.gb.wide{width:100%;margin-top:10px}.gb.big{min-height:46px;font-size:15px;padding:10px 18px;background:var(--accent);color:var(--accent-ink)}.gb.danger{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.col{display:flex;flex-direction:column;gap:8px}.grow{flex:1}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--raise);color:var(--ink);min-width:0;max-width:100%;min-height:36px;box-sizing:border-box;-webkit-user-select:text;user-select:text}
select{cursor:pointer}input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip,.chips button,.tabs button{background:var(--raise);border:1px solid var(--line);border-radius:999px;font:inherit;font-size:12.5px;font-weight:560;color:var(--ink);padding:6px 12px;cursor:pointer;min-height:34px}
.chip.on,.chips button.on,.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tabs{display:flex;gap:4px;margin:4px 0 10px;padding:3px;background:var(--raise);border-radius:12px}.tabs button{flex:1;border:0;background:transparent;border-radius:9px}.tabs button.on{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.list{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--raise);margin:8px 0}.li{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}.li.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}.li .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ls{width:56px;display:flex;justify-content:center;flex:none}.ls svg{max-width:100%;height:30px}
.list.short{max-height:140px}
.prev{background:var(--raise);border-radius:12px;padding:10px;text-align:center;margin:8px 0;overflow:hidden}.prev svg{max-width:100%;height:auto;max-height:70px}.spr{text-align:center;background:var(--raise);border-radius:12px;padding:8px;margin-bottom:8px}.spr svg{max-width:100%;height:46px}
.bar{height:6px;background:var(--raise2);border-radius:3px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--good);border-radius:3px}
.tb{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}.tb th,.tb td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}.tb th{color:var(--faint);font-weight:600;font-size:11.5px}.tb th:first-child,.tb td:first-child{text-align:left}.tb tr.sum td{font-weight:700}.tb tr.gold td{background:var(--accent-soft);font-weight:750}.scroll{overflow-x:auto}
.ord{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}.ord button{font:inherit;font-size:12px;padding:4px 9px;border:0;background:var(--raise2);border-radius:8px;cursor:pointer;color:var(--ink);min-height:30px}
.nw{padding:9px 0 9px 14px;border-bottom:1px solid var(--line);position:relative}.nw::before{content:"";position:absolute;left:0;top:15px;width:7px;height:7px;border-radius:50%;background:var(--info)}.nw.bad::before{background:var(--bad)}.nw.good::before{background:var(--good)}
.nw button{font:inherit;font-size:12px;border:0;background:var(--raise2);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;margin-left:4px;min-height:28px}
.big{font-size:34px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.big small{font-size:14px;color:var(--dim);font-weight:500}
.obj{margin:6px 0}.obj.done{color:var(--good)}.obj.failed{color:var(--bad)}
.gr{width:100%;height:auto;background:var(--raise);border-radius:12px;color:var(--dim)}
.tlist{max-height:300px;overflow:auto;margin-top:8px}.t{padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}.t.pass b{color:var(--good)}.t.fail b{color:var(--bad)}.err{color:var(--bad);padding-left:8px;word-break:break-word}.sum{font-weight:700;margin:8px 0}.sum.good{color:var(--good)}.sum.bad{color:var(--bad)}
.fleet{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.fv{border-radius:14px;background:var(--raise);border:1px solid var(--line);overflow:hidden}.fv.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fr{display:flex;align-items:center;gap:10px;padding:9px 10px;cursor:pointer;min-height:44px}.fs{width:56px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--raise);border-radius:10px}.fs svg{max-width:90%;height:22px}
.fm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.fm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.fm .bad{color:var(--bad);font-weight:650}
.fp{font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fx{padding:2px 10px 10px;border-top:1px solid var(--line)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--raise2);color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}.st.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}.st.bad::before{background:var(--bad)}.st.idle::before{background:var(--faint)}
.oe{border:1px solid var(--line);border-radius:12px;padding:8px;margin:6px 0;background:var(--raise)}.oe.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}.oh{display:flex;align-items:center;gap:6px}.oh select{flex:1;min-width:0}.oe .row{margin:6px 0 0}.oe .row select{flex:1;min-width:0}
.oe button{font:inherit;font-size:12px;padding:5px 10px;border:0;background:var(--raise2);border-radius:8px;cursor:pointer;color:var(--ink);min-height:32px}.oe button:disabled{opacity:.4}
.tag{background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}.small{font-size:11.5px;margin-top:3px}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.mat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:7px 9px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer;min-width:0}.mat.on{border-color:var(--accent);background:var(--accent-soft)}.mat.none{opacity:.55}.mat .ms svg{height:20px;max-width:100%}.mat .dim{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.set{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-height:36px}.set input[type=range]{flex:1;min-width:0}.set select{margin-left:auto}.set input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
input[type=range]{accent-color:var(--accent);padding:0;border:0;background:none}
.saves{display:flex;flex-direction:column;gap:8px;margin:8px 0}.sv{border:1px solid var(--line);border-radius:14px;background:var(--raise);padding:10px}.svn{display:flex;flex-direction:column}.svn span{font-size:12px;color:var(--dim)}
.sv button{font:inherit;font-size:12px;padding:5px 11px;border:0;background:var(--raise2);border-radius:9px;cursor:pointer;color:var(--ink);min-height:34px;font-weight:600}.sv button.armed{background:var(--bad);color:#fff}
.cg{margin:6px 0}.sv-row{cursor:pointer}.wide-sel{width:100%;margin:4px 0 8px}
.scs{display:flex;flex-direction:column;gap:8px;margin:8px 0}.sc{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font:inherit;color:var(--ink);cursor:pointer}.sc:hover{border-color:var(--accent)}.sc span{font-size:12.5px;color:var(--dim)}
.endbox{background:var(--glass-strong);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;text-align:left;box-shadow:var(--shadow)}.endbox h2{margin:0 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0;font-size:12px;color:var(--dim)}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:3px;vertical-align:middle}
.sh{margin:6px 0;border-bottom:1px solid var(--line)}
/* summary cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:6px 0 4px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.card .cl{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.card .cv{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

// ---------------------------------------------------------------------- rivals
function aiApi(rv) {

  return {
    width: m.w, height: m.h,
    tileCost(x, y) {
      const i = y * m.w + x;
      if (m.water[i]) return null;
      if (R.roads.hasRoad(x, y)) return 1;
      if (m.occupied[i] && !indTiles.has(i)) return null;
      return 8 + (m.forest[i] ? 3 : 0);

    buildRoad(owner, path) {
      let n = 0;
      for (const p of path) { const i = p.y * m.w + p.x; if (!R.roads.hasRoad(p.x, p.y)) { m.forest[i] = 0; m.occupied[i] = 1; R.roads.addRoad(p.x, p.y); n++; } }

      const s = stationById(from); if (!s) return null;
      const vh = makeVehicle(rv.ai.id, modelId, s, [from, to]);

      return vehiclePrice(mod);
    },

}

  vh.noRoute = false;
  if (!path.length) return true;
  const block = []; let prev = vh.tile;
  for (const t of path) {
    block.push(t);
    if (stopsHere(t, t.x - prev.x, t.y - prev.y)) break;
    prev = t;
  }
  if (!block.every(t => railFree(t, vh.id))) return false;     // red signal: wait
  // Waiting at a block signal: the whole block ahead must be empty, not just this route.
  const here = signalAt(tk(vh.tile)), d0 = { dx: path[0].x - vh.tile.x, dy: path[0].y - vh.tile.y };
  if (here && !here.path && (here.two || (here.dx === d0.dx && here.dy === d0.dy))) {
    for (const k of blockTiles(path[0], vh.tile)) { const o = R.res.get(k); if (o && o !== vh.id && !railDepotAt(k)) return false; }
  }
  for (const t of block) claim(t, vh.id);
  vh.res = block;
  return true;
}

function trainStep(vh) {
  const dest = destTile(vh);
  if (!dest) { vh.state = "idle"; return; }
  if (!vh.trail) vh.trail = [{ ...vh.tile }];
  if (!vh.res) vh.res = [];
  const goals = goalTiles(dest);
  if (!vh.res.length && goals.has(tk(vh.tile))) {
    // pull up to the far end of the platform, then stop
    const d = vh.dir || { dx: 0, dy: 0 }, n = { x: vh.tile.x + d.dx, y: vh.tile.y + d.dy };
    if ((d.dx || d.dy) && inB(n.x, n.y) && goals.has(tk(n)) && R.rail.hasRoad(n.x, n.y) && railFree(n, vh.id) && !(needsElec(vh) && !isElec(n.x, n.y))) { claim(n, vh.id); vh.res = [n]; }
    else if (OR.arrive(vh.orders, { kind: dest.kind, id: dest.id })) { dock(vh, dest); return; }
  }
  if (!vh.res.length && !reserveAhead(vh, goals)) {
    vh.state = "idle"; vh.wait++; vh.red = !vh.noRoute;
    if (vh.red) {
      if (vh.redSince == null) vh.redSince = S.totalDays;
      if (vh.owner === "player" && !vh.stuckWarned && S.totalDays - vh.redSince > 30) {
        vh.stuckWarned = true;
        EV.addNews(S.news, S.date, "bad", "Train #" + vh.id.slice(1) + " has waited a month for a free line. Add a passing loop with signals or a second platform.", { x: vh.tile.x, y: vh.tile.y });
      }
    }
    if (vh.noRoute && vh.wait > 240) { vh.wait = 0; OR.skipOrder(vh.orders); }
    return;
  }
  if (!vh.res.length) { vh.state = "idle"; return; }
  const next = vh.res.shift();
  vh.from = { x: vh.tile.x, y: vh.tile.y }; vh.to = next; vh.p = 0; vh.state = "moving"; vh.wait = 0; vh.red = false; vh.redSince = null; vh.stuckWarned = false;
  vh.dir = { dx: next.x - vh.tile.x, dy: next.y - vh.tile.y };
}

// Called when the head reaches vh.to.
function trainArrive(vh) {
  const L = trainLen(modelOf(vh));
  vh.trail.unshift({ x: vh.tile.x, y: vh.tile.y });
  while (vh.trail.length > L) {
    const old = vh.trail.pop();
    if (!vh.trail.some(t => sameT(t, old)) && !vh.res.some(t => sameT(t, old))) release(old, vh.id);
  }
}

// ---- level crossings and electrification
function crossingAt(x, y) { return R.rail.hasRoad(x, y) && R.roads.hasRoad(x, y); }

}

  const c = cost(ELEC_COST); if (S.company.cash < c) return { ok: false, reason: "Not enough money." };
  spend("construction", c); S.elec[key(x, y)] = 1; return { ok: true, cost: c };
}

// ---- multi-tile stations: a station tile next to one of your stations of the same kind joins it
function stationNeighbour(x, y, kind, owner) {

// ---------------------------------------------------------------- climates
// Which cargo exists in this game, and how towns in snow or desert depend on deliveries.
function climateCargos() {
  const kinds = (mapgen.CLIMATE_INDUSTRIES[S && S.cfg ? S.cfg.climate : "temperate"]) || mapgen.CLIMATE_INDUSTRIES.temperate;
  const set = new Set(["passengers", "mail"]);

  return [...set];
}
// What an industry takes in this climate: a factory takes rubber only where rubber is grown.
function inputsHere(kind) { const ch = core.CHAINS[kind] || {}, have = climateCargos(); return (ch.in || []).filter(c => have.includes(c)); }
function cargoUse(c) {
  if (CARGO_USE[c]) return CARGO_USE[c];

  const from = kinds.filter(k => CARGO_FROM_IND[k] === c).map(k => mapgen.INDUSTRY_LABELS[k].toLowerCase());
  const to = kinds.filter(k => (CARGO_TO_IND[c] || []).includes(k)).map(k => mapgen.INDUSTRY_LABELS[k].toLowerCase());

}

// ---------------------------------------------------------------- vehicle kinds
function isShipModel(m) { return !!m && m.type === "ship"; }

const ANYWHERE = { connected: () => true, hasRoad: () => true, removeVehicle() {}, moveVehicle() {} };

// ---------------------------------------------------------------- water
function rebuildSea() {
  const m = S.map; R.sea = new roadnet.RoadNetwork(null, 4); R.sea.turnCost = 0;
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const i = y * m.w + x;
    if (m.water[i] && (!m.occupied[i] || R.depotAt.has(i) || (S.spans[i] && S.spans[i].kind === "bridge"))) R.sea.addRoad(x, y);
  }
  for (const s of S.stations) if (s.kind === "dock" && s.water) R.sea.addRoad(s.water.x, s.water.y);
}
function waterNeighbour(x, y) {
  for (const [dx, dy] of DIR4) { const nx = x + dx, ny = y + dy; if (inB(nx, ny) && S.map.water[key(nx, ny)] && !S.map.occupied[key(nx, ny)]) return { x: nx, y: ny }; }
  return null;
}
function landNeighbour(x, y) { for (const [dx, dy] of DIR4) { const nx = x + dx, ny = y + dy; if (inB(nx, ny) && !S.map.water[key(nx, ny)]) return true; } return false; }

// Oil rigs come with their own dock that any company may use.
function makeRigDocks() {
  for (const i of S.map.industries) {
    if (i.kind !== "oilRig" || S.stations.some(s => s.rigId === i.id)) continue;
    const w = [[2, 0], [-2, 0], [0, 2], [0, -2]].map(([dx, dy]) => ({ x: i.x + dx, y: i.y + dy })).find(t => inB(t.x, t.y) && S.map.water[key(t.x, t.y)]);
    if (!w) continue;
    const s = ST.newStation("s" + (++S.ids.s), i.name, "dock", i.x, i.y);
    s.owner = "public"; s.rigId = i.id; s.water = w; s.tiles = [{ x: i.x, y: i.y }];
    S.stations.push(s);

}

// ---------------------------------------------------------------- docks and shipyards
// Size of the open water a tile belongs to (counted up to a limit), so a dock faces the lake, not a pond.
function waterReach(t, limit) {
  const seen = new Set([key(t.x, t.y)]), q = [t];
  for (let n = 0; n < q.length && seen.size < limit; n++) for (const [dx, dy] of DIR4) { const nx = q[n].x + dx, ny = q[n].y + dy, k = key(nx, ny); if (inB(nx, ny) && !seen.has(k) && R.sea.hasRoad(nx, ny)) { seen.add(k); q.push({ x: nx, y: ny }); } }
  return seen.size;
}
function freeShore(x, y) { const k = key(x, y); return inB(x, y) && !S.map.water[k] && !S.map.occupied[k] && !R.roads.hasRoad(x, y) && !R.rail.hasRoad(x, y); }
function placeDock(x, y, owner) {
  owner = owner || "player"; let i = key(x, y); const m = S.map;
  let w = null;
  if (inB(x, y) && m.water[i]) {
    // tapped the water: put the dock on the free shore tile next to it
    if (m.occupied[i]) return { ok: false, reason: "Something is built here." };
    const land = DIR4.map(([dx, dy]) => ({ x: x + dx, y: y + dy })).find(t => freeShore(t.x, t.y));
    if (!land) return { ok: false, reason: "Build a dock on the shore, next to water." };
    w = { x, y }; x = land.x; y = land.y; i = key(x, y);
  }
  if (!inB(x, y)) return { ok: false, reason: "Build a dock on the shore, next to water." };
  if (m.occupied[i] || R.roads.hasRoad(x, y) || R.rail.hasRoad(x, y)) return { ok: false, reason: "Something is built here." };
  if (!w) { const opts = DIR4.map(([dx, dy]) => ({ x: x + dx, y: y + dy })).filter(t => inB(t.x, t.y) && m.water[key(t.x, t.y)] && !m.occupied[key(t.x, t.y)]); w = opts.sort((a, b) => waterReach(b, 3000) - waterReach(a, 3000))[0] || null; }
  if (!w) return { ok: false, reason: "A dock needs open water next to it." };
  const no = owner === "player" ? councilRefuses(x, y) : ""; if (no) return { ok: false, reason: no };
  const c = cost(2400); if (owner === "player") { if (S.company.cash < c) return { ok: false, reason: "Not enough money." }; spend("construction", c); }
  if (m.forest[i]) m.forest[i] = 0;
  const s = ST.newStation("s" + (++S.ids.s), nameStation("dock", x, y), "dock", x, y);
  s.owner = owner; s.water = w; s.tiles = [{ x, y }];
  S.stations.push(s); R.stationAt.set(i, s); m.occupied[i] = 1; m.forest[i] = 0; R.sea.addRoad(w.x, w.y);
  return { ok: true, station: s, cost: c, tile: { x, y } };
}
function placeShipyard(x, y, owner) {
  owner = owner || "player";
  const i = key(x, y), m = S.map;
  if (!inB(x, y) || !m.water[i] || m.occupied[i]) return { ok: false, reason: "Build a shipyard on open water next to the shore." };
  if (!landNeighbour(x, y)) return { ok: false, reason: "A shipyard must touch the shore." };
  const c = cost(3500);
  if (owner === "player") { if (S.company.cash < c) return { ok: false, reason: "Not enough money." }; spend("construction", c); }
  const d = { id: "d" + (++S.ids.d), name: townOf(x, y).name + " Shipyard", x, y, kind: "ship", owner };
  S.depots.push(d); R.depotAt.set(i, d); m.occupied[i] = 1;
  return { ok: true, depot: d, cost: c };
}

// ---------------------------------------------------------------- airports
const AIRPORTS = { small: { size: 2, cost: 9000, year: 1950, label: "Small airport" }, large: { size: 3, cost: 22000, year: 1965, label: "City airport" } };
function placeAirport(x, y, type, owner) {
  owner = owner || "player"; const a = AIRPORTS[type], m = S.map;
  if (S.date.year < a.year) return { ok: false, reason: a.label + "s are available from " + a.year + "." };
  let h = null;
  for (let dy = 0; dy < a.size; dy++) for (let dx = 0; dx < a.size; dx++) {
    const tx = x + dx, ty = y + dy, i = key(tx, ty);
    if (!inB(tx, ty) || m.water[i] || m.occupied[i] || R.roads.hasRoad(tx, ty) || R.rail.hasRoad(tx, ty)) return { ok: false, reason: "An airport needs " + a.size + " x " + a.size + " clear land." };
    if (h === null) h = m.height[i]; else if (m.height[i] !== h) return { ok: false, reason: "The land must be flat. Use Raise or Lower first." };
  }
  const no = owner === "player" ? councilRefuses(x, y) : ""; if (no) return { ok: false, reason: no };
  const c = cost(a.cost); if (owner === "player") { if (S.company.cash < c) return { ok: false, reason: "Not enough money." }; spend("construction", c); }
  const s = ST.newStation("s" + (++S.ids.s), nameStation("airport", x, y), "airport", x, y);
  s.owner = owner; s.size = type; s.tiles = [];
  for (let dy = 0; dy < a.size; dy++) for (let dx = 0; dx < a.size; dx++) { const t = { x: x + dx, y: y + dy }; s.tiles.push(t); R.stationAt.set(key(t.x, t.y), s); m.occupied[key(t.x, t.y)] = 1; m.forest[key(t.x, t.y)] = 0; }
  S.stations.push(s);
  // every airport has a hangar to buy and service aircraft
  S.depots.push({ id: "d" + (++S.ids.d), name: s.name + " Hangar", x, y, kind: "air", owner, airport: s.id });
  return { ok: true, station: s, cost: c };
}
function airportCentre(s) { const n = (AIRPORTS[s.size] || AIRPORTS.small).size; return { x: s.x + (n - 1) / 2, y: s.y + (n - 1) / 2 }; }
function canUseStation(m, s) {
  if (s.kind === "airport" && isJet(m) && s.size !== "large") return false;
  return true;
}

// Aircraft fly in a straight line between airports.
function airStep(vh) {
  const dest = destTile(vh); if (!dest) { vh.state = "idle"; return; }
  const st = dest.kind === "stop" ? stationById(dest.id) : stationById((depotById(dest.id) || {}).airport);
  if (!st) { vh.state = "idle"; return; }
  if (vh.at === st.id) {
    if (dest.kind === "depot") { if (OR.arrive(vh.orders, { kind: "depot", id: dest.id })) { vh.emergency = false; dock(vh, dest); return; } }
    else if (OR.arrive(vh.orders, { kind: "stop", id: st.id })) { core.serviceVehicle(vh.core, modelOf(vh)); dock(vh, dest); return; }
  }
  const c = airportCentre(st), here = vh.pos || { x: vh.tile.x, y: vh.tile.y };
  vh.from = { x: here.x, y: here.y }; vh.to = { x: c.x, y: c.y }; vh.p = 0; vh.state = "moving"; vh.at = null; vh.goal = st.id;
  vh.flightLen = Math.max(1, Math.hypot(c.x - here.x, c.y - here.y));
  vh.dir = { dx: Math.sign(Math.round(c.x - here.x)), dy: Math.sign(Math.round(c.y - here.y)) };
}
// A plane that breaks down does not stop in the air: it slows and lands at the nearest airport.
function aircraftEmergency(vh) {
  const here = vh.state === "moving" ? { x: vh.from.x + (vh.to.x - vh.from.x) * vh.p, y: vh.from.y + (vh.to.y - vh.from.y) * vh.p } : (vh.pos || vh.tile);
  let best = null, bd = 1e9;
  for (const s of S.stations) if (s.kind === "airport" && s.owner === vh.owner && canUseStation(modelOf(vh), s)) { const c = airportCentre(s), d = Math.hypot(c.x - here.x, c.y - here.y); if (d < bd) { bd = d; best = s; } }
  if (!best) return;
  const hangar = S.depots.find(d => d.airport === best.id); if (!hangar) return;
  vh.orders.orders.splice(vh.orders.current, 0, { kind: "depot", depotId: hangar.id, temp: true }); vh.orders.phase = "travelling";
  vh.emergency = true; vh.broken = false;
  if (vh.state === "moving") { vh.pos = here; vh.tile = { x: Math.round(here.x), y: Math.round(here.y) }; vh.state = "idle"; vh.at = null; airStep(vh); }
  if (vh.owner === "player") { EV.addNews(S.news, S.date, "bad", modelOf(vh).name + " #" + vh.id.slice(1) + " has an engine fault and is landing at " + best.name + ".", { x: best.x, y: best.y }); sound.play("breakdown"); }
}
function airMove(vh, dtDays) {
  const m = modelOf(vh); if (!m) return;
  vh.p += dtDays * (m.speedKmh / 40) * (vh.emergency ? 0.5 : 1) / vh.flightLen;
  if (vh.p >= 1) { vh.pos = { x: vh.to.x, y: vh.to.y }; vh.tile = { x: Math.round(vh.to.x), y: Math.round(vh.to.y) }; vh.from = vh.to; vh.p = 0; vh.state = "idle"; vh.at = vh.goal; tryStep(vh); }
}

// ---------------------------------------------------------------- one-way roads
function roadAxis(x, y) {
  const has = (a, b) => inB(a, b) && R.roads.hasRoad(a, b);
  const xs = has(x + 1, y) || has(x - 1, y), ys = has(x, y + 1) || has(x, y - 1);
  if (xs && ys) return null;
  return ys ? "y" : "x";
}
function cycleOneWay(x, y) {
  const k = key(x, y);
  if (!R.roads.hasRoad(x, y)) return { ok: false, reason: "One-way signs go on roads." };
  if (R.stationAt.has(k) || R.depotAt.has(k) || R.rail.hasRoad(x, y)) return { ok: false, reason: "Not on stops, depots or crossings." };
  const ax = roadAxis(x, y); if (!ax) return { ok: false, reason: "Put one-way signs on straight road, not junctions." };
  const [d1, d2] = ax === "x" ? [[1, 0], [-1, 0]] : [[0, 1], [0, -1]];
  const cur = S.oneway[k];
  const next = !cur ? { dx: d1[0], dy: d1[1] } : cur.dx === d1[0] && cur.dy === d1[1] ? { dx: d2[0], dy: d2[1] } : null;
  if (next) S.oneway[k] = next; else delete S.oneway[k];
  R.roads.invalidate();

}
function oneWayOk(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const ob = S.oneway[b.y * S.map.w + b.x]; if (ob && !(ob.dx === dx && ob.dy === dy)) return false;
  const oa = S.oneway[a.y * S.map.w + a.x]; if (oa && !(oa.dx === dx && oa.dy === dy)) return false;
  return true;
}

// ------------------------------------------------------------------- rendering
// The map is drawn in passes. First the ground (terrain, water, roads, track) for every visible
// tile, then the shadows, then everything standing on the ground in back-to-front order, then
// vehicles, smoke, night and lights. Ground colours are worked out once per 16 x 16 chunk and kept
// until the land in that chunk changes.
const cv = $("#map"), ctx = cv.getContext("2d");
const view = { x: 0, y: 0, z: 1.4 };
let dpr = 1, cssW = 300, cssH = 300;

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cssW = Math.max(100, r.width); cssH = Math.max(100, r.height);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  cv.style.width = cssW + "px"; cv.style.height = cssH + "px";
  // the floating bars sit over the map; other overlays keep clear of them
  const tb = $("#topbar"), tl = $("#tools"), root = document.documentElement.style;
  if (tb && tl) { root.setProperty("--toph", Math.round(tb.getBoundingClientRect().bottom) + "px"); root.setProperty("--dockh", Math.round(window.innerHeight - tl.getBoundingClientRect().top) + "px"); }
}
function iso(x, y, h) { return { x: (x - y) * TW / 2, y: (x + y) * TH / 2 - (h || 0) * HS }; }
function tileH(x, y) {
  const i = y * S.map.w + x;
  const sp = S.spans[i]; if (sp) return sp.h;
  return S.map.height[i];
}
function screenToTile(sx, sy) {
  const wx = (sx - view.x) / view.z, wy = (sy - view.y) / view.z;
  const u = wx / (TW / 2);
  for (let h = 12; h >= 0; h--) {
    const v = (wy + h * HS) / (TH / 2);
    const x = Math.round((u + v) / 2), y = Math.round((v - u) / 2);
    if (!inB(x, y)) continue;
    if (S.map.height[key(x, y)] === h || (S.map.water[key(x, y)] && h === 0)) return { x, y };
  }
  const v = wy / (TH / 2);
  const x = Math.round((u + v) / 2), y = Math.round((v - u) / 2);
  return inB(x, y) ? { x, y } : null;
}
function centerOn(x, y) {
  const p = iso(x, y, tileH(x, y));
  view.x = cssW / 2 - p.x * view.z; view.y = cssH / 2 - p.y * view.z;
}
function rgbOf(c) {
  if (c[0] === "r") { const m = c.match(/\d+/g); return [+m[0], +m[1], +m[2]]; }
  const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255];

function card(label, value, sub, extra, neg) { return "<div class='card'><div class='cl'>" + label + "</div><div class='cv" + (neg ? " neg" : "") + "'>" + value + "</div>" + (sub ? "<div class='cs'>" + sub + "</div>" : "") + (extra || "") + "</div>"; }
function spark(vals, col) {
  if (!vals || vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals), W = 120, H = 28, sp = hi - lo || 1;
  const pts = vals.map((v, i) => (i / (vals.length - 1) * W).toFixed(1) + "," + (H - 2 - (v - lo) / sp * (H - 4)).toFixed(1));
  return "<svg class='spark' viewBox='0 0 " + W + " " + H + "' preserveAspectRatio='none'><polygon points='0," + H + " " + pts.join(" ") + " " + W + "," + H + "' fill='" + col + "' opacity='.14'/><polyline points='" + pts.join(" ") + "' fill='none' stroke='" + col + "' stroke-width='1.8' vector-effect='non-scaling-stroke' stroke-linejoin='round'/></svg>";
}

// ------------------------------------------------------------- orders editing
// Pure helpers first (tested), then the DOM editor and the fleet list.
function markServed(s, cargo) { if (!s) return; s.served[cargo] = true; if (s.daysSincePickup[cargo] == null) s.daysSincePickup[cargo] = 0; }
function resetIfCurrent(vh, i) {
  if (i === vh.orders.current && vh.state === "docked") { vh.orders.phase = "travelling"; vh.orders.dwellDays = 0; vh.state = "idle"; }
}
function setStopStation(vh, i, sid) {
  const od = vh.orders.orders[i]; if (!od || od.kind !== "stop") return false;
  const s = stationById(sid); if (!s) return false;
  od.stationId = sid; markServed(s, vh.cargo); resetIfCurrent(vh, i); return true;
}
function setStopLoad(vh, i, mode) { const od = vh.orders.orders[i]; if (!od || od.kind !== "stop" || !["auto", "full", "none"].includes(mode)) return false; od.load = mode; return true; }
function setStopUnload(vh, i, mode) { const od = vh.orders.orders[i]; if (!od || od.kind !== "stop" || !["auto", "none"].includes(mode)) return false; od.unload = mode; return true; }
function addStopTo(vh, sid, load) { const s = stationById(sid); if (!s) return false; OR.addStop(vh.orders, sid, load || "auto"); markServed(s, vh.cargo); if (vh.state === "idle" && vh.orders.orders.length === 1) vh.orders.phase = "travelling"; return true; }
function removeStop(vh, i) { if (!vh.orders.orders[i]) return false; const wasCur = i === vh.orders.current; OR.removeOrder(vh.orders, i); if (wasCur) { vh.orders.phase = "travelling"; if (vh.state === "docked") vh.state = "idle"; } return true; }
function moveOrder(vh, i, dir) {
  const o = vh.orders, j = i + dir; if (j < 0 || j >= o.orders.length) return false;
  [o.orders[i], o.orders[j]] = [o.orders[j], o.orders[i]];
  if (o.current === i) o.current = j; else if (o.current === j) o.current = i;
  return true;
}
function similarVehicles(vh) { const m = modelOf(vh); return playerVehicles().filter(v => v !== vh && v.cargo === vh.cargo && stationKindFor(modelOf(v)) === stationKindFor(m) && isJet(modelOf(v)) === isJet(m)); }
function copyOrdersToSimilar(vh) {
  const list = similarVehicles(vh);
  for (const v of list) { const n = OR.cloneOrders(vh.orders, v.id); v.orders = n; v.state = v.state === "docked" ? "idle" : v.state; for (const od of n.orders) if (od.kind === "stop") markServed(stationById(od.stationId), v.cargo); }
  return list.length;
}
function stopNote(s, cargo) {
  const p = producesAt(s, cargo), a = acceptsAt(s, cargo);
  return p && a ? "picks up and delivers " + cargo : p ? "has " + cargo + " to pick up" : a ? "accepts " + cargo : "no " + cargo + " here";
}
function orderWarnings(vh) {
  const out = OR.validate(vh.orders, id => !!stationById(id)).slice(0, 2);
  const stops = vh.orders.orders.filter(o => o.kind === "stop").map(o => ({ o, s: stationById(o.stationId) })).filter(x => x.s);
  if (stops.length >= 2) {
    if (!stops.some(x => x.o.load !== "none" && producesAt(x.s, vh.cargo))) out.push("None of these stops has " + vh.cargo + " to pick up.");
    if (!stops.some(x => x.o.unload !== "none" && acceptsAt(x.s, vh.cargo))) out.push("None of these stops accepts " + vh.cargo + ", so nothing gets paid.");
  }
  if (isShip(vh) && R.sea) for (const x of stops) if (x.s.water && !R.sea.connected(vh.tile, x.s.water)) out.push(x.s.name + " is on other water. This ship cannot sail there.");
  for (const x of stops) if (x.o.load === "full" && !producesAt(x.s, vh.cargo)) out.push("Full load at " + x.s.name + " will wait a long time: there is no " + vh.cargo + " there.");
  return out;
}

// Stops in the towns this vehicle already serves that it could also call at.
function townStopsMissing(vh) {
  const have = new Set(vh.orders.orders.filter(o => o.kind === "stop").map(o => o.stationId)), towns = new Set();
  for (const id of have) { const s = stationById(id); if (s) covered(s).towns.forEach(t => towns.add(t)); }
  if (!towns.size) return [];
  return S.stations.filter(s => !have.has(s.id) && reachable(vh, s) && (producesAt(s, vh.cargo) || acceptsAt(s, vh.cargo)) && [...covered(s).towns].some(t => towns.has(t)));
}
// Put each missing stop right after the stop in the same town that it is closest to.
function addTownStops(vh) {
  const add = townStopsMissing(vh);
  for (const s of add) {
    const list = vh.orders.orders; let at = list.length, bd = 1e9;
    list.forEach((o, i) => { if (o.kind !== "stop") return; const t = stationById(o.stationId); if (!t) return; const d = Math.abs(t.x - s.x) + Math.abs(t.y - s.y); if (d < bd && [...covered(t).towns].some(x => covered(s).towns.has(x))) { bd = d; at = i + 1; } });
    OR.addStop(vh.orders, s.id, "auto"); const o = list.pop(); list.splice(at, 0, o); if (vh.orders.current >= at && list.length > 1) vh.orders.current++;
    markServed(s, vh.cargo);
  }
  return add.length;
}

// ------------------------------------------------------------------- undo
// Building actions the player can take back, newest last. Each refunds what it cost.
const UNDO_MAX = 25;
function pushUndo(a) { R.undo.push(a); if (R.undo.length > UNDO_MAX) R.undo.shift(); updateUndoBtn(); }
function vehicleOnTile(net, x, y) { if (net === R.rail) return R.res.has(key(x, y)) || S.vehicles.some(v => isTrain(v) && trainTiles(v).some(t => t.x === x && t.y === y)); return R.roads.vehiclesAt({ x, y }).length > 0; }
function refund(c) { if (c > 0) { S.company.cash += c; post("construction", c); } }
function undoLast() {
  const a = R.undo[R.undo.length - 1]; if (!a) return { ok: false, reason: "Nothing to undo." };
  const m = S.map;
  if (a.kind === "road" || a.kind === "track" || a.kind === "crossing") {
    const net = a.kind === "road" || a.net === "road" ? R.roads : R.rail;
    for (const t of a.tiles) {
      const i = key(t.x, t.y);
      if (R.stationAt.has(i) || R.depotAt.has(i)) return { ok: false, reason: "Remove the stop or depot on that stretch first." };
      if (vehicleOnTile(net, t.x, t.y)) return { ok: false, reason: "A vehicle is on that stretch. Try again in a moment." };
    }
    for (const t of a.tiles) { const i = key(t.x, t.y); net.removeRoad(t.x, t.y); if (net === R.rail) { delete S.signals[i]; delete S.elec[i]; } if (!R.roads.hasRoad(t.x, t.y) && !R.rail.hasRoad(t.x, t.y)) { m.occupied[i] = 0; delete S.spans[i]; } }
  } else if (a.kind === "elec") {
    for (const t of a.tiles) delete S.elec[key(t.x, t.y)];
  } else if (a.kind === "signal") {
    if (a.prev) S.signals[a.k] = a.prev; else delete S.signals[a.k];
  } else if (a.kind === "station") {
    const st = stationById(a.id); if (!st) { R.undo.pop(); updateUndoBtn(); return { ok: false, reason: "That stop is already gone." }; }
    const t = a.tile || { x: st.x, y: st.y };
    if (R.stationAt.get(key(t.x, t.y)) !== st) { R.undo.pop(); updateUndoBtn(); return { ok: false, reason: "That stop is already gone." }; }
    removeStationTile(st, t.x, t.y);
  } else if (a.kind === "depot") {
    const d = depotById(a.id); if (!d) { R.undo.pop(); updateUndoBtn(); return { ok: false, reason: "That depot is already gone." }; }
    S.depots = S.depots.filter(x => x !== d); R.depotAt.delete(key(d.x, d.y));
  } else if (a.kind === "terrain") {
    for (const c of a.changes) if (m.occupied[c.i]) return { ok: false, reason: "Something has been built on that land since." };
    for (const c of a.changes) { m.height[c.i] = c.h; m.water[c.i] = c.w; }
  }
  R.undo.pop(); refund(a.cost); updateUndoBtn(); sound.play("demolish");
  return { ok: true, kind: a.kind, cost: a.cost };
}
function updateUndoBtn() { const b = document.getElementById("bundo"); if (b) b.disabled = !R || !R.undo.length; }

// Terrain changes as a list of tiles that differ, so undo restores only those.
function terrainDiff(beforeH, beforeW) {
  const m = S.map, out = [];
  for (let i = 0; i < m.height.length; i++) if (m.height[i] !== beforeH[i] || m.water[i] !== beforeW[i]) out.push({ i, h: beforeH[i], w: beforeW[i] });

// --------------------------------------------------- drag-to-build preview
// Road and track are planned while the finger is down and built when it lifts.
function planTiles(a, b) {
  const pts = [{ x: a.x, y: a.y }]; let x = a.x, y = a.y;
  while (x !== b.x) { x += Math.sign(b.x - x); pts.push({ x, y }); }
  while (y !== b.y) { y += Math.sign(b.y - y); pts.push({ x, y }); }
  return pts;
}
function startPlan(t) { if (!t) return; ui.plan = { tool: ui.tool, start: t, end: t }; refreshPlan(); }
function updatePlan(t) { if (!ui.plan || !t) return; if (t.x === ui.plan.end.x && t.y === ui.plan.end.y) return; ui.plan.end = t; refreshPlan(); if (Math.abs(t.x - ui.plan.start.x) + Math.abs(t.y - ui.plan.start.y) > 0) { const a = iso(ui.plan.start.x, ui.plan.start.y, 0), sx = view.x + a.x * view.z, sy = view.y + a.y * view.z; if (sx < 0 || sy < 0 || sx > cssW || sy > cssH) ui.plan.long = true; } }
function refreshPlan() {
  const p = ui.plan, track = p.tool === "track", wire = p.tool === "electrify", unit = cost(wire ? ELEC_COST : track ? TRACK_COST : ROAD_COST);
  let total = 0, fresh = 0, bad = 0, blocked = false;
  const pts = planTiles(p.start, p.end);
  // which way the line runs through each tile, so crossings can be checked
  pts.forEach((q, k) => { const ax = (a, b) => a && b ? (a.x !== b.x ? "x" : "y") : null; const i = ax(pts[k - 1], q), o = ax(q, pts[k + 1]); q.along = i && o && i !== o ? "corner" : i || o || null; });
  p.tiles = pts.map(q => {
    const why = wire ? canElectrify(q.x, q.y) : track ? canBuildTrackOn(q.x, q.y, q.along) : canBuildRoadOn(q.x, q.y, q.along);
    if (why === "exists") return { ...q, st: "have" };
    if (why || blocked) { blocked = true; bad++; return { ...q, st: "bad", why }; }
    const c = unit + (!wire && S.map.forest[key(q.x, q.y)] ? cost(CLEAR_TREE) : 0) + (!wire && (track ? R.roads : R.rail).hasRoad(q.x, q.y) ? cost(CROSSING_EXTRA) : 0); total += c; fresh++;
    return { ...q, st: "ok", c };
  });
  p.cost = total;
  const name = wire ? "Electrification" : track ? "Track" : "Road";
  $("#hint").textContent = fresh || bad ? name + ": " + fresh + " new tile" + (fresh === 1 ? "" : "s") + ", " + money(total) + (bad ? ". Stops before a blocked tile." : "") + (total > S.company.cash ? " Not enough money." : "") : name + ": already built here.";
}
function commitPlan() {
  const p = ui.plan; ui.plan = null; const bar = document.getElementById("planbar"); if (bar) bar.hidden = true; if (!p || !p.tiles) return;
  const built = []; let spent = 0;
  for (const q of p.tiles) {
    if (q.st === "bad") { if (q.why && q.why !== "exists") toast(q.why, true); break; }
    if (q.st !== "ok") continue;
    const r = p.tool === "electrify" ? electrifyTile(q.x, q.y) : p.tool === "track" ? buildTrackTile(q.x, q.y, true, q.along) : buildRoadTile(q.x, q.y, true, q.along);
    if (!r.ok) { toast(r.reason, true); break; }
    if (r.cost) { built.push({ x: q.x, y: q.y }); spent += r.cost; }
  }
  if (built.length) { pushUndo({ kind: p.tool === "electrify" ? "elec" : p.tool === "track" ? "track" : "road", tiles: built, cost: spent }); sound.play("build"); toast("Built " + built.length + " tile" + (built.length === 1 ? "" : "s") + " for " + money(spent) + "."); }
  setTool(ui.tool);
}

// --------------------------------------------------------- vehicle management
// Start/stop, stop in depot, clone, old-age warnings, autorenew, autoreplace, refit,
// station details, and bays at bigger road stops.

const ELECTRIC_LOCO = /^(Volt|Arc|Meridian|Tempest)/;

// Draw a side-view sprite so it lines up with the isometric road or track it is on.
// Moving along +x the vehicle heads down-right, along +y down-left; the shear keeps
// its wheels on the ground line, which gives four distinct directions.
// With a `look` the vehicle also gets a roof and the end face the camera can see (its

  if (look) {

    if (towardsCamera) { const g1 = P(endX, top + (bot - top) * 0.15), g2 = P(endX, top + (bot - top) * 0.5); ctx.fillStyle = "rgba(191,227,255,.9)"; ctx.beginPath(); ctx.moveTo(g1[0] + ddx * 0.15, g1[1] + ddy * 0.15); ctx.lineTo(g2[0] + ddx * 0.15, g2[1] + ddy * 0.15); ctx.lineTo(g2[0] + ddx * 0.85, g2[1] + ddy * 0.85); ctx.lineTo(g1[0] + ddx * 0.85, g1[1] + ddy * 0.85); ctx.closePath(); ctx.fill(); }

// ---- age, autorenew and autoreplace

// What this vehicle should become at its next depot visit, if anything.

    if (to && to !== m.parts.locoId) { const tm = V.buildTrainModel(to, m.parts.wagonId, m.parts.n); if (tm) return { model: tm, why: "replace" }; }
    if (rr.renew && ageYears(vh) >= lifeOf(m) - 0.5 && V.availableModels(y, "locomotive").some(l => l.id === m.parts.locoId)) return { model: m, why: "renew" };

}

      const pick = V.availableModels(y, "wagon").filter(x => x.cargo === c).sort((a, b) => Math.abs(a.introYear - w.introYear) - Math.abs(b.introYear - w.introYear))[0];

// ---- road stops with several bays: spread vehicles over the tiles
function bayFor(vh, st) {
  const tiles = stationTiles(st).filter(t => R.roads.hasRoad(t.x, t.y));
  if (!tiles.length) return { x: st.x, y: st.y };
  const parked = (t) => R.roads.vehiclesAt(t).filter(id => id !== vh.id && (S.vehicles.find(v => v.id === id) || {}).state === "docked").length;
  if (vh.bay && tiles.some(t => sameT(t, vh.bay)) && parked(vh.bay) < 2) return vh.bay;
  let best = tiles[0], bs = 1e9;
  for (const t of tiles) { const sc = parked(t) * 8 + Math.abs(t.x - vh.tile.x) + Math.abs(t.y - vh.tile.y); if (sc < bs) { bs = sc; best = t; } }
  vh.bay = best; return best;
}

// --------------------------------------------------------------- town councils
// Each town rates your company from -1000 to 1000. Cutting trees and tearing up roads
// lowers it; good service, advertising and planting trees raise it. Below "Very poor"

const RATING_LABELS = [[-400, "Appalling"], [-200, "Very poor"], [0, "Poor"], [200, "Mediocre"], [400, "Good"], [600, "Very good"], [800, "Excellent"], [1e9, "Outstanding"]];

function ratingLabel(v) { for (const [lim, l] of RATING_LABELS) if (v < lim) return l; return "Outstanding"; }

function townZone(x, y) {

  return best;
}
function councilRefuses(x, y) {
  const t = townZone(x, y); if (!t || townRating(t) >= REFUSE_BELOW) return "";
  return "The " + t.name + " council refuses: your rating there is " + ratingLabel(townRating(t)) + ". Advertise or plant trees to win them back.";
}
function townMonthly() {
  for (const t of S.map.towns) {
    let d = (250 - townRating(t)) * 0.03;   // drifts back towards neutral
    for (const s of S.stations) {
      if (s.owner !== "player" || townZone(s.x, s.y) !== t) continue;
      const rs = Object.keys(s.served).map(c => ST.ratingOf(s, c)); if (!rs.length) continue;
      const best = Math.max(...rs); d += best >= 0.5 ? 12 : best < 0.3 ? -6 : 3;
    }
    bumpRating(t, d);
  }
  if (S.ads) for (const id of Object.keys(S.ads)) { S.ads[id].days -= 30; if (S.ads[id].days <= 0) delete S.ads[id]; }
}
function adsDaily() {
  if (!S.ads) return;
  for (const [id, ad] of Object.entries(S.ads)) {
    const t = S.map.towns.find(x => x.id === id); if (!t) continue;
    for (const s of S.stations) if (s.owner === "player" && Math.max(Math.abs(s.x - t.x), Math.abs(s.y - t.y)) <= ad.r) for (const c of Object.keys(s.served)) s.daysSincePickup[c] = Math.min(s.daysSincePickup[c] ?? 0, 2);
  }
}
const ADS = [["Small advertising campaign", 2000, 30, 5, 15], ["Medium advertising campaign", 5000, 60, 8, 35], ["Large advertising campaign", 10000, 90, 12, 60]];
function advertise(t, size) {
  const [, base, days, r, rate] = ADS[size], c = cost(base);

  const api = { width: m.w, height: m.h, tileCost(x, y) {
    const i = key(x, y); if (m.water[i] || S.spans[i]) return null;
    if (R.rail.hasRoad(x, y)) return railOwnerOf(i) === ai.id && !R.stationAt.has(i) ? 1 : null;
    if (R.roads.hasRoad(x, y)) return R.stationAt.has(i) || R.depotAt.has(i) ? null : 9;
    if (m.occupied[i]) return null;
    return 4 + (m.forest[i] ? 2 : 0);
  } };
  const path = AI.findPath(api, ends.a, ends.b); if (!path || path.length < 8) return;
  let price = 0; for (const p of path) if (!R.rail.hasRoad(p.x, p.y)) price += cost(TRACK_COST) + (R.roads.hasRoad(p.x, p.y) ? cost(CROSSING_EXTRA) : 0);
  const loco = V.availableModels(S.date.year, "locomotive").filter(l => !ELECTRIC_LOCO.test(l.name)).sort((a, b) => a.price - b.price)[0];
  const wag = V.availableModels(S.date.year, "wagon").filter(w => w.cargo === cargo).pop();
  if (!loco || !wag) return;
  const tm = V.buildTrainModel(loco.id, wag.id, 4);
  const total = price + cost(RAIL_STATION_COST) * 2 + cost(RAIL_DEPOT_COST) + vehiclePrice(tm);
  if (ai.cash - total < 30000) return;
  for (const p of path) { const i = key(p.x, p.y); if (R.rail.hasRoad(p.x, p.y)) continue; m.forest[i] = 0; m.occupied[i] = 1; R.rail.addRoad(p.x, p.y); if (!S.railOwner) S.railOwner = {}; S.railOwner[i] = ai.id; }
  const s1 = placeStation(path[0].x, path[0].y, "trainStation", ai.id), s2 = placeStation(path[path.length - 1].x, path[path.length - 1].y, "trainStation", ai.id);
  const dp = placeDepot(path[1].x, path[1].y, "rail", ai.id);
  if (!s1.ok || !s2.ok || !dp.ok) return;
  const vh = makeVehicle(ai.id, tm.id, dp.depot, [s1.station.id, s2.station.id]); vh.core.breakdownsEnabled = false;
  ai.cash -= total; rv.rail.push({ cargo, from: s1.station.id, to: s2.station.id });
  EV.addNews(S.news, S.date, "info", ai.name + " opened a " + cargo + " railway from " + ends.from.name + " to " + ends.to.name + ".", { x: path[0].x, y: path[0].y });
  for (const s of S.stations) if (s.owner === "player" && ST.covers(s, ends.from.x, ends.from.y) && s.served[cargo]) { EV.addNews(S.news, S.date, "bad", ai.name + " now competes with you for " + cargo + " at " + ends.from.name + ".", { x: ends.from.x, y: ends.from.y }); break; }
}

// Rivals also open oil tanker routes from rigs and air routes between big towns.
function rivalSeaAirMonth(rv) {

// ---------------------------------------------------------- prices and inflation
function vehiclePrice(m) { return Math.round(m.price * (S ? S.inflation : 1)); }
function saleValue(vh) { return Math.round(core.vehicleSalePrice(vh.core, modelOf(vh)) * S.inflation); }

// ------------------------------------------------------------- shares, takeover
function rivalValue(rv) {
  const fleet = S.vehicles.filter(v => v.owner === rv.ai.id);
  return Math.max(0, Math.round(rv.ai.cash + fleet.reduce((a, v) => a + saleValue(v), 0) + S.stations.filter(s => s.owner === rv.ai.id).length * 800));
}
function sharePrice(rv) { return Math.max(5000, Math.round(rivalValue(rv) / 4 / 100) * 100); }
function buyShare(rv) {
  if (rv.ai.bankrupt) return { ok: false, reason: "That company is bankrupt." };
  rv.shares = rv.shares || 0; if (rv.shares >= 4) return { ok: false, reason: "You already own it." };
  const p = sharePrice(rv); if (S.company.cash < p) return { ok: false, reason: "Not enough money." };
  S.company.cash -= p; post("other", -p); rv.shares++;
  if (rv.shares >= 4) { takeOver(rv); return { ok: true, cost: p, takeover: true }; }
  return { ok: true, cost: p };
}
function sellShare(rv) {
  if (!rv.shares) return { ok: false, reason: "You have no shares in it." };
  const p = Math.round(sharePrice(rv) * 0.95); S.company.cash += p; post("other", p); rv.shares--;
  return { ok: true, value: p };
}
function takeOver(rv) {
  const id = rv.ai.id;
  for (const v of S.vehicles) if (v.owner === id) { v.owner = "player"; v.orders.autoService = true; v.core.breakdownsEnabled = S.settings.breakdowns > 0; if (!v.profit) v.profit = { thisYear: 0, lastYear: 0, lifetime: 0 }; }
  for (const s of S.stations) if (s.owner === id) s.owner = "player";
  for (const d of S.depots) if (d.owner === id) d.owner = "player";
  if (S.railOwner) for (const k of Object.keys(S.railOwner)) if (S.railOwner[k] === id) delete S.railOwner[k];
  S.company.cash += rv.ai.cash; post("other", rv.ai.cash);
  S.rivals = S.rivals.filter(r => r !== rv);
  EV.addNews(S.news, S.date, "good", "You have taken over " + rv.ai.name + ". Its vehicles and stations are now yours.");
  sound.play("cash");
}

// ------------------------------------------------------------ cargo payment rates
const RATE_COL = { passengers: "#2e6f9e", mail: "#c0392b", coal: "#2b2b2e", goods: "#7b3fa0", wood: "#8a5a2b", steel: "#6b7785", grain: "#c99a1e" };
function rateCol(c) { return RATE_COL[c] || PILE_COL[c] || "#888"; }
function cargoRatesSvg() {
  const cs = climateCargos(), W = 320, H = 180, L = 46, Rr = 8, T = 8, B = 22, days = [];
  for (let d = 0; d <= 200; d += 10) days.push(d);
  const pay = (c, d) => core.deliveryIncome(c, 10, { x: 0, y: 0 }, { x: 20, y: 0 }, d, S.inflation) * INCOME_SCALE * ((c === "passengers" || c === "mail") ? 1 : FREIGHT_BONUS);
  const hi = Math.max(...cs.map(c => pay(c, 0))) * 1.05;
  const x = i => L + i / (days.length - 1) * (W - L - Rr), y = v => T + (1 - v / hi) * (H - T - B);
  let g = "";
  for (let t = 0; t <= 4; t++) { const v = hi * t / 4; g += "<line x1='" + L + "' x2='" + (W - Rr) + "' y1='" + y(v) + "' y2='" + y(v) + "' stroke='#b8b088'/><text x='" + (L - 4) + "' y='" + (y(v) + 3) + "' font-size='9' text-anchor='end' fill='#4a4426'>£" + Math.round(v) + "</text>"; }
  days.forEach((d, i) => { if (d % 50 === 0) g += "<text x='" + x(i) + "' y='" + (H - 6) + "' font-size='9' text-anchor='middle' fill='#4a4426'>" + d + "</text>"; });
  for (const c of cs) g += "<polyline fill='none' stroke='" + rateCol(c) + "' stroke-width='2' points='" + days.map((d, i) => x(i).toFixed(1) + "," + y(pay(c, d)).toFixed(1)).join(" ") + "'/>";
  return "<svg viewBox='0 0 " + W + " " + H + "' class='gr'>" + g + "</svg><div class='legend'>" + cs.map(c => "<span><i style='background:" + rateCol(c) + "'></i>" + (CARGO_NAME[c] || c) + "</span>").join("") + "</div><p class='dim small'>Payment for 10 units carried 20 tiles, by days in transit. Trains earn " + TRAIN_BONUS + " times this.</p>";
}

// ------------------------------------------------------------------ minimap
// A small overview of the whole map. Tap or drag on it to move the view there.
const MM = { canvas: null, img: null, at: 0, size: 112, show: true };
function minimapColour(x, y) {
  const m = S.map, i = y * m.w + x, k = key(x, y);
  if (R.stationAt.has(k)) { const s = R.stationAt.get(k); return s.owner === "player" ? "#1e5aa8" : s.owner === "public" ? "#777" : "#c0392b"; }
  if (R.rail.hasRoad(x, y)) return "#6b4a2b";
  if (R.roads.hasRoad(x, y)) return "#55585e";
  if (R.bld.has(k)) return "#c0392b";
  if (m.water[i]) return "#4f9fd6";
  if (m.forest[i]) return "#2f6b2f";
  const pal = palette(); return pal.top[m.height[i]] || "#78a853";
}
function renderMinimapImage() {
  const m = S.map, c = document.createElement("canvas"); c.width = m.w; c.height = m.h;
  const g = c.getContext("2d"), data = g.createImageData(m.w, m.h);
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const cache = {};
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const col = minimapColour(x, y), rgb = cache[col] || (cache[col] = /^#[0-9a-f]{6}$/i.test(col) ? hex(col) : [120, 168, 83]), o = (y * m.w + x) * 4;
    data.data[o] = rgb[0]; data.data[o + 1] = rgb[1]; data.data[o + 2] = rgb[2]; data.data[o + 3] = 255;
  }
  for (const ind of m.industries) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const x = ind.x + dx, y = ind.y + dy; if (!inB(x, y)) continue; const o = (y * m.w + x) * 4; data.data[o] = 230; data.data[o + 1] = 170; data.data[o + 2] = 40; }
  g.putImageData(data, 0, 0); MM.img = c;
}
function drawMinimap(now) {
  const cvm = MM.canvas; if (!cvm || !S || !MM.show) return;
  MM.size = window.innerWidth >= 900 ? 150 : 112;
  if (!MM.img || now - MM.at > 2000) { renderMinimapImage(); MM.at = now; }
  const g = cvm.getContext("2d"), n = MM.size, d = Math.min(2, window.devicePixelRatio || 1);
  if (cvm.width !== n * d) { cvm.width = n * d; cvm.height = n * d; cvm.style.width = n + "px"; cvm.style.height = n + "px"; }
  g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, n, n);
  // draw the map turned 45 degrees so it matches the isometric view
  g.save(); g.translate(n / 2, n / 2); g.scale(1, 0.5); g.rotate(Math.PI / 4);
  const s = n / Math.SQRT2 / S.map.w * 1.0;
  g.imageSmoothingEnabled = false; g.drawImage(MM.img, -S.map.w * s / 2, -S.map.h * s / 2, S.map.w * s, S.map.h * s);
  g.restore();
  // the part of the map on screen
  const corners = [[0, 0], [cssW, 0], [cssW, cssH], [0, cssH]].map(([sx, sy]) => { const wx = (sx - view.x) / view.z, wy = (sy - view.y) / view.z; return mmPoint((wx / (TW / 2) + wy / (TH / 2)) / 2, (wy / (TH / 2) - wx / (TW / 2)) / 2); });
  g.strokeStyle = "#fff"; g.lineWidth = 1.2; g.beginPath(); corners.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.closePath(); g.stroke();
  for (const v of playerVehicles()) { const p = mmPoint(v.tile.x, v.tile.y); g.fillStyle = "#ffe26b"; g.fillRect(p.x - 1, p.y - 1, 2, 2); }
}
function mmPoint(tx, ty) { const n = MM.size, s = n / Math.SQRT2 / S.map.w, u = (tx - S.map.w / 2) * s, v = (ty - S.map.h / 2) * s; return { x: n / 2 + (u - v) * Math.SQRT1_2, y: n / 2 + (u + v) * Math.SQRT1_2 * 0.5 }; }
function mmToTile(px, py) { const n = MM.size, s = n / Math.SQRT2 / S.map.w, a = (px - n / 2) / Math.SQRT1_2, b = (py - n / 2) / (Math.SQRT1_2 * 0.5); return { x: (a + b) / 2 / s + S.map.w / 2, y: (b - a) / 2 / s + S.map.h / 2 }; }
function setupMinimap() {
  MM.canvas = $("#minimap"); if (!MM.canvas) return;
  let down = false;
  const go = (e) => { const r = MM.canvas.getBoundingClientRect(), t = mmToTile(e.clientX - r.left, e.clientY - r.top); ui.follow = null; centerOn(clamp(Math.round(t.x), 0, S.map.w - 1), clamp(Math.round(t.y), 0, S.map.h - 1)); };
  MM.canvas.addEventListener("pointerdown", e => { down = true; MM.canvas.setPointerCapture(e.pointerId); go(e); e.stopPropagation(); });
  MM.canvas.addEventListener("pointermove", e => { if (down) go(e); });
  MM.canvas.addEventListener("pointerup", () => { down = false; });
  const set = (on) => { MM.show = on; MM.canvas.hidden = !on; document.body.classList.toggle("mm-on", on); };
  set(window.innerWidth >= 600);   // phones start with the minimap folded away
  $("#bmm").onclick = () => set(!MM.show);
}

// Cloud saves (kept in your Claude account, private to you) and online races (everyone

const CLOUD = { db: null, uid: null, ready: false };

async function initOnline() {

    const [db, user, room] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("room")]);

// ---- cloud saves: one small document per save plus its pieces underneath

async function joinRace(code, name, host, cfg, room) {

// -------------------------------------------------------- industries grow and shrink
// Every industry has a size from 1 to 5. A well served industry expands now and then, which
// raises its output and adds buildings on the map. One left alone for a long time shrinks.
// On top of that, mines, farms and wells have the odd boom or bust.
const IND_MAX_LEVEL = 5, IND_MAX_OUTPUT = 900;
const BOOM_TEXT = {
  coalMine: ["A rich new coal seam has been found at {n}.", "The coal seam at {n} is running thin."],
  goldMine: ["A new gold vein has been struck at {n}.", "The gold at {n} is running out."],
  diamondMine: ["Large diamonds found at {n}.", "{n} is finding fewer diamonds."],
  forest: ["New planting at {n} is ready to cut.", "Storms have flattened trees at {n}."],
  farm: ["A bumper harvest at {n}.", "A poor harvest at {n}."],
  oilWell: ["A new oil field is flowing at {n}.", "The oil field at {n} is drying up."],
  oilRig: ["A new well has come on stream at {n}.", "The field under {n} is running dry."],
};
function indName(i) { return i.kind.replace(/([A-Z])/g, " $1").toLowerCase(); }
function isPrimaryInd(i) { const ch = core.CHAINS[i.kind] || {}; return !!ch.out && !ch.in; }
function setOutput(i, v) { i.productionPerMonth = clamp(Math.round(v), 4, IND_MAX_OUTPUT); }

// What this industry handled last month: output for mines and farms, deliveries for factories.
function industryThroughput(i) {
  if (isPrimaryInd(i)) return i.productionPerMonth;
  const got = Object.values(i.received || {}).reduce((a, b) => a + b, 0), was = i._recLast || 0;
  i._recLast = got; return got - was;
}
function expandIndustry(i, news) {
  if ((i.level || 1) >= IND_MAX_LEVEL) return false;
  i.level = (i.level || 1) + 1;
  if (isPrimaryInd(i)) setOutput(i, i.productionPerMonth * 1.35);
  if (news) EV.addNews(S.news, S.date, "good", i.name + " is expanding. It is now size " + i.level + " of " + IND_MAX_LEVEL + ".", { x: i.x, y: i.y });
  return true;
}
function shrinkIndustry(i, news) {
  if ((i.level || 1) <= 1) return false;
  i.level--;
  if (isPrimaryInd(i)) setOutput(i, i.productionPerMonth * 0.75);
  if (news) EV.addNews(S.news, S.date, "bad", i.name + " has cut back to size " + i.level + ".", { x: i.x, y: i.y });
  return true;
}
function industryMonth() {
  for (const i of S.map.industries) {
    if (!i.level) i.level = 1;
    const prim = isPrimaryInd(i), done = industryThroughput(i);
    i.hist = (i.hist || []).concat([done]).slice(-24);
    if (prim) {
      // the station rating swings a lot from month to month, so use a running average
      const r0 = serviceRatingOf(i.id); i.rAvg = i.rAvg == null ? r0 : i.rAvg * 0.75 + r0 * 0.25; const r = i.rAvg;
      i.goodMonths = r >= 0.4 ? (i.goodMonths || 0) + 1 : 0;
      i.idleMonths = r0 < 0.05 ? (i.idleMonths || 0) + 1 : 0;
      // expands after a stretch of good service; very rarely on its own
      const p = i.goodMonths >= 6 ? 0.06 : r > 0.3 ? 0.012 : 0.003;
      if (rng() < p) { if (expandIndustry(i, true)) i.goodMonths = 0; }
      else if (i.idleMonths >= 24 && rng() < 0.04) { if (shrinkIndustry(i, true)) i.idleMonths = 0; }
      // booms and busts
      if (rng() < 0.008) {
        const up = rng() < (r > 0.5 ? 0.65 : 0.45), t = BOOM_TEXT[i.kind];
        setOutput(i, i.productionPerMonth * (up ? 1.5 + rng() * 0.5 : 0.5 + rng() * 0.2));
        const txt = t ? t[up ? 0 : 1].replace("{n}", i.name) : (up ? "Output at " + i.name + " has jumped." : "Output at " + i.name + " has dropped sharply.");
        EV.addNews(S.news, S.date, up ? "good" : "bad", txt + (up ? " Production is up by half or more." : " Production is down by a third or more."), { x: i.x, y: i.y });
      }
    } else {
      // factories and plants grow with the cargo you bring them
      const recent = i.hist.slice(-3), avg = recent.reduce((a, b) => a + b, 0) / Math.max(1, recent.length);
      if (avg > 50 * i.level && rng() < 0.08) expandIndustry(i, true);
      else if (i.hist.length >= 18 && i.hist.slice(-18).every(v => v === 0) && rng() < 0.03) shrinkIndustry(i, true);
      // a bigger factory turns more of what it gets into goods
      i.bonus = 1 + (i.level - 1) * 0.1;
    }
  }
}
// Extra output from a bigger factory, added to what it made this month.
function industryBonusOutput(i) {
  const ch = core.CHAINS[i.kind] || {};
  if (!ch.in || !ch.out || !i.bonus || i.bonus <= 1) return;
  const made = i.output[ch.out] || 0; if (made) i.output[ch.out] = Math.round(made * i.bonus);
}

// Extra buildings drawn around an industry as it grows: sheds, stores and tanks.
function drawIndustryGrowth(px, py, ind, c) {
  const lv = ind.level || 1; if (lv < 2) return;
  // drawn back to front: the ones further up the screen first
  const spots = [[10, -8, 0.55, 14], [-26, 4, 0.55, 11], [24, 6, 0.6, 12], [-4, 14, 0.62, 10]].slice(0, Math.min(lv - 1, 4)).sort((a, b) => a[1] - b[1]);
  for (const [dx, dy, w, h] of spots) {
    const x = px + dx, y = py + dy, a = w * TW / 2, b = w * TH / 2;
    box(x, y, w, h, shadeC(c, 1.3), shadeC(c, 1.05), shadeC(c, 0.78));
    // a pitched metal roof
    poly([x - a, y - h, x, y - h - b, x, y - h - b - 5, x - a, y - h - 5], "#aab0b8");
    poly([x, y - h + b, x - a, y - h, x - a, y - h - 5, x, y - h + b - 5], "#c4c9cf");
    poly([x + a, y - h, x, y - h + b, x, y - h + b - 5, x + a, y - h - 5], "#8e949c");
    poly([x - a, y - h - 5, x, y - h - b - 5, x + a, y - h - 5, x, y - h + b - 5], "#b7bcc3");
  }
}

// Size, output history and what makes it grow, for the industry window.
function industryGrowthHtml(i) {
  const lv = i.level || 1, hist = (i.hist || []).slice(-12), prim = isPrimaryInd(i);
  let h = "<div class='kv'><span>Size</span><b>" + "●".repeat(lv) + "<span class='dim'>" + "●".repeat(IND_MAX_LEVEL - lv) + "</span> " + lv + " of " + IND_MAX_LEVEL + "</b></div>";
  if (hist.length >= 2) {
    const a = hist.slice(0, Math.floor(hist.length / 2)), b = hist.slice(Math.floor(hist.length / 2));
    const avg = (x) => x.reduce((p, q) => p + q, 0) / Math.max(1, x.length), d = avg(b) - avg(a);
    const trend = Math.abs(d) < Math.max(2, avg(a) * 0.05) ? "Steady" : d > 0 ? "Growing" : "Falling";
    h += "<div class='kv'><span>" + (prim ? "Output" : "Delivered") + ", last " + hist.length + " months</span><b>" + trend + "</b></div><div class='card' style='margin:6px 0'>" + spark(hist, trend === "Falling" ? "var(--bad)" : "var(--good)") + "</div>";
  }
  h += "<p class='dim small'>" + (prim ? "Keep the station rating at 40% or more for half a year and it may expand. Left unserved for two years, it shrinks." : "Deliver a steady supply and it expands. Each size makes 10% more from what it gets.") + "</p>";
  return h;
}

  const before = { cash: S.company.cash, pax: S.metrics.passengers, cargo: S.metrics.cargo };
  for (let i = 0; i < n; i++) { moveVehicles(1); dailyTick(); }
  return { days: n, cash: Math.round(S.company.cash - before.cash), pax: S.metrics.passengers - before.pax, cargo: S.metrics.cargo - before.cargo, date: S.date };
}

function runTests(onEach) {
  const prev = { S, R, view: { ...view } }; const results = [];
  const snapUI = ui.tool;
  for (const [grp, name, fn] of TESTS) {
    const t0 = performance.now(); let ok = true, err = "";
    try { fn(); } catch (e) { ok = false; err = (e && e.message) || String(e); }
    const r = { grp, name, ok, err, ms: Math.round(performance.now() - t0) }; results.push(r); if (onEach) onEach(r);
  }
  window.__testResults = results; return results;
}

function testsWin() {

    body.innerHTML = "<p class='dim'>Runs every module on fresh maps. It replaces the game in progress, so save first if you care about it.</p><div class='row'></div><div class='sum' id='tsum'>Not run yet.</div><div id='tlist' class='tlist'></div>";

  });
}

window.__TT_DEBUG = { get S(){return S}, get R(){return R}, runTests, buildDemoRoute, demoLine, buildDemoShip, buildDemoAir, simulateDays, startGame, buyVehicle, TESTS, centerOn, view, ui, run: (src) => eval(src) };
