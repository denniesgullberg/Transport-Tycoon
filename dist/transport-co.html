  if ((depot.kind || "road") !== dk) return { ok: false, msg: dk === "rail" ? "Trains are built at a train depot on a track." : "Buses and trucks are built at a road depot." };
  if (S.company.cash < m.price) return { ok: false, msg: "Not enough money." };
  const pair = bestPair(m.cargo, depot, stationKindFor(m), netFor(dk));
  spend("newVehicles", m.price);
  const vh = makeVehicle("player", modelId, depot, pair || []);
  sound.play("build");
  return { ok: true, vh, pair };
}
function sellVehicle(vh) {
  const m = modelOf(vh);
  const val = core.vehicleSalePrice(vh.core, m);
  S.company.cash += val; post("other", val);
  removeVehicle(vh);
  sound.play("cash");
  return val;
}

function destTile(vh) {
  const d = OR.destination(vh.orders); if (!d) return null;
  if (d.kind === "stop") { const s = stationById(d.id); return s ? { x: s.x, y: s.y, kind: "stop", id: s.id } : null; }
  let dp = d.id ? depotById(d.id) : null;
  if (!dp) { dp = nearestDepot(vh.tile, depotKindOf(modelOf(vh))); }
  return dp ? { x: dp.x, y: dp.y, kind: "depot", id: dp.id } : null;
}
function nearestDepot(t, dk) {
  dk = dk || "road"; const net = netFor(dk);
  let best = null, bd = 1e9;
  for (const d of S.depots) { if ((d.kind || "road") !== dk) continue; const dist = Math.abs(d.x - t.x) + Math.abs(d.y - t.y); if (dist < bd && net.connected(d, t)) { bd = dist; best = d; } }
  return best;
}

function tryStep(vh) {
  const dest = destTile(vh);
  if (!dest) { vh.state = "idle"; return; }
  if (vh.tile.x === dest.x && vh.tile.y === dest.y) {
    if (OR.arrive(vh.orders, { kind: dest.kind, id: dest.id })) { dock(vh, dest); return; }
  }
  const net = netOf(vh);
  const next = net.nextTile(vh.id, vh.tile, dest);
  if (!next) { vh.state = "idle"; vh.wait++; if (vh.wait > 240) { vh.wait = 0; OR.skipOrder(vh.orders); } return; }
  if (!net.canEnter(vh.id, next)) { vh.state = "idle"; return; }
  net.moveVehicle(vh.id, vh.tile, next);
  vh.from = { x: vh.tile.x, y: vh.tile.y }; vh.to = next; vh.p = 0; vh.state = "moving"; vh.wait = 0;
  vh.dir = { dx: next.x - vh.tile.x, dy: next.y - vh.tile.y };
}

function dock(vh, dest) {
  vh.state = "docked"; vh.p = 0; vh.to = vh.tile;
  const m = modelOf(vh);
  if (dest.kind === "depot") { core.serviceVehicle(vh.core, m); vh.core.daysSinceService = 0; return; }
  const st = stationById(dest.id);
  if (!st) return;
  if (vh.loaded > 0 && vh.origin !== st.id && OR.shouldUnload(vh.orders) && acceptsAt(st, vh.cargo)) {
    const from = stationById(vh.origin) || st;
    const days = Math.max(0, S.totalDays - vh.loadDay);
    const raw = ST.payForDelivery(from, st, vh.cargo, vh.loaded, days, S.inflation);
    const mult = ((vh.cargo === "passengers" || vh.cargo === "mail") ? 1 : FREIGHT_BONUS) * (isTrainModel(m) ? TRAIN_BONUS : 1);
    const inc = Math.max(1, Math.round(raw * INCOME_SCALE * mult));
    const cat = isTrainModel(m) ? "incomeRail" : "incomeRoad";
    S.company.cash += inc; post(cat, inc); S.qIncome += inc;
    if (vh.cargo === "passengers") S.metrics.passengers += vh.loaded; else S.metrics.cargo += vh.loaded;
    S.metrics.quarterCargo += vh.loaded;
    if (vh.owner === "player") { vh.profit.thisYear += inc; vh.profit.lifetime += inc; if (inc > 40) sound.play("cash"); }
    else { const rv = S.rivals.find(r => r.ai.id === vh.owner); if (rv) { const route = rv.ai.routes.find(x => x.fromStation === from.id && x.toStation === st.id); if (route) AI.recordIncome(rv.ai, route.id, inc); else rv.ai.cash += inc; } }
    // deliver raw cargo to industries that use it
    for (const i of covered(st).inds) if ((CARGO_TO_IND[vh.cargo] || []).includes(i.kind)) { i.input[vh.cargo] = (i.input[vh.cargo] || 0) + vh.loaded; i.received = i.received || {}; i.received[vh.cargo] = (i.received[vh.cargo] || 0) + vh.loaded; break; }
    vh.loaded = 0; vh.origin = null;
  }
}

function dailyVehicle(vh) {
  const m = modelOf(vh); if (!m) return;
  const r = core.tickVehicleDay(vh.core, m, () => rng() / Math.max(0.01, S.settings.breakdowns || 1));
  if (r === "broke") { vh.broken = true; if (vh.owner === "player") { EV.addNews(S.news, S.date, "bad", m.name + " has broken down.", { x: vh.tile.x, y: vh.tile.y }); sound.play("breakdown"); } }
  else if (r === "ok") vh.broken = false;
  if (vh.owner === "player") {
    const c = core.vehicleRunningCostPerDay(m, S.inflation);
    S.company.cash -= c; post(isTrainModel(m) ? "runningRail" : "runningRoad", -c); vh.profit.thisYear -= c; vh.profit.lifetime -= c;
    if (vh.state !== "docked" && S.depots.some(d => (d.kind || "road") === depotKindOf(m))) {
      const dp = nearestDepot(vh.tile, depotKindOf(m));
      OR.maybeInsertService(vh.orders, core.needsService(vh.core), dp ? dp.id : undefined);
    }
  }
  if (vh.state === "docked") {
    const o = OR.currentOrder(vh.orders);
    if (o && o.kind === "stop") {
      const st = stationById(o.stationId);
      if (st && OR.shouldLoad(vh.orders)) {
        ST.recordPickup(st, vh.cargo, m.speedKmh, vh.core.ageDays / 365);
        if (vh.loaded === 0 || vh.origin === st.id) {
          const got = ST.loadOnto(st, vh.cargo, m.capacity - vh.loaded);
          if (got > 0) { if (vh.loaded === 0) { vh.origin = st.id; vh.loadDay = S.totalDays; } vh.loaded += got; }
        }
      }
    }
    if (OR.tickDock(vh.orders, vh.loaded, m.capacity, 1) === "depart") { vh.state = "idle"; tryStep(vh); }
  }
}
function depotsExist() { return S.depots.length > 0; }

function moveVehicles(dtDays) {
  for (const vh of S.vehicles) {
    if (vh.broken) continue;
    if (vh.state === "moving") {
      const m = modelOf(vh); if (!m) continue;
      const tilesPerDay = m.speedKmh / 40 * netOf(vh).speedFactor(vh.from, vh.to, tractionOf(vh));
      vh.p += dtDays * tilesPerDay;
      let guard = 4;
      while (vh.p >= 1 && vh.state === "moving" && guard-- > 0) {
        vh.p -= 1; vh.tile = { x: vh.to.x, y: vh.to.y }; vh.state = "idle";
        const keep = vh.p; tryStep(vh); if (vh.state === "moving") vh.p = keep; else vh.p = 0;
      }
    } else if (vh.state === "idle") {
      vh.wait2 = (vh.wait2 || 0) + 1;
      if (vh.wait2 % 6 === 0) tryStep(vh);
    }
  }
}

// ------------------------------------------------------------------ time ticks
function dailyTick() {
  const st = core.advanceDay(S.date);
  S.date = st.date; S.totalDays++;
  const m = S.map;
  for (const t of m.towns) {
    t._acc = (t._acc || 0) + S.settings.growth;
    while (t._acc >= 1) {
      t._acc -= 1;
      if (core.tickTownDay(t, rng)) {
        const g = mapgen.growTown(m, t.id, rng);
        if (g && g.kind === "road") R.roads.addRoad(g.x, g.y);
        if (g) { const b = t.buildings[t.buildings.length - 1]; if (g.kind === "house" && b) R.bld.set(b.y * m.w + b.x, b); }
      }
    }
  }
  for (const s of S.stations) ST.tickStationDay(s);
  for (const vh of S.vehicles.slice()) dailyVehicle(vh);
  if (st.newMonth) monthlyTick();
  if (st.newQuarter) quarterlyTick();
  if (st.newYear) yearlyTick();
}

function companyValue() {
  const vv = playerVehicles().map(v => core.vehicleSalePrice(v.core, modelOf(v)));
  return Math.round(S.company.cash - S.company.loan + vv.reduce((a, b) => a + b, 0) + S.stations.filter(s => s.owner === "player").length * 500);
}
function townsConnected() {
  const set = new Set();
  for (const vh of playerVehicles()) for (const o of vh.orders.orders) if (o.kind === "stop") { const s = stationById(o.stationId); if (s) covered(s).towns.forEach(t => set.add(t)); }
  return set.size;
}
function metricsNow() {
  return { passengers: S.metrics.passengers, cargo: S.metrics.cargo, cash: S.company.cash, companyValue: companyValue(), townsConnected: townsConnected(), vehicles: playerVehicles().length, yearlyProfit: S.monthNet.slice(-12).reduce((a, b) => a + b, 0) };
}

function monthlyTick() {
  const m = S.map;
  const before = S.company.cash;
  for (const i of m.industries) core.tickIndustryMonth(i, rng);
  for (const i of m.industries) { const r = serviceRatingOf(i.id); if (CARGO_FROM_IND[i.kind] && ["coalMine", "forest", "farm"].includes(i.kind)) core.serviceBonus(i, r, rng); }
  ST.monthlyCargo(S.stations, m.towns, m.industries, rng);
  ST.decayWaiting(S.stations);
  ST.updateTownActivity(m.towns, S.stations);
  const interest = core.chargeMonthlyInterest(S.company); post("interest", -interest);
  // rival upkeep
  for (const rv of S.rivals) {
    const fleet = S.vehicles.filter(v => v.owner === rv.ai.id);
    rv.ai.cash -= fleet.reduce((a, v) => a + (modelOf(v) ? modelOf(v).runningCostPerYear / 12 : 0), 0);
  }
  // events
  const actions = EV.rollMonthlyEvents({ date: S.date, startYear: S.startYear, inflation: S.inflation, interestRate: S.company.interestRate, towns: m.towns, industries: m.industries, serviceRating: serviceRatingOf }, S.evState, S.news, rng);
  for (const a of actions) {
    if (a.kind === "setProduction") { const i = m.industries.find(x => x.id === a.industryId); if (i) i.productionPerMonth = a.value; }
    if (a.kind === "closeIndustry") removeIndustry(a.industryId);
    if (a.kind === "openIndustry") { const s = mapgen.addIndustry(m, a.industryKind, rng, a.near); if (s) rebuildLookups(); }
    if (a.kind === "setInterestRate") S.company.interestRate = a.value;
  }
  const reward = EV.checkObjectives(S.objectives, metricsNow(), S.date, S.news);
  if (reward) { S.company.cash += reward; post("other", reward); sound.play("cash"); }
  // rivals plan
  const ends = mapgen.toEndpoints(m);
  for (const rv of S.rivals) {
    const log = AI.tickAiMonth(rv.ai, aiApi(rv), ends, S.date.year, rng);
    for (const line of log) EV.addNews(S.news, S.date, "info", line);
  }
  let inc = 0, exp = 0; for (const k of Object.keys(S.acc)) { if (S.acc[k] > 0) inc += S.acc[k]; else exp -= S.acc[k]; }
  monthIncomeTrack(inc, exp);
  flushLedger();
  S.monthNet.push(Math.round(S.company.cash - before)); if (S.monthNet.length > 24) S.monthNet.shift();
  S.history.push({ year: S.date.year, month: S.date.month, income: S.lastIncome || 0, expenses: S.lastExpenses || 0, cash: Math.round(S.company.cash), loan: S.company.loan, cargoDelivered: S.metrics.cargo + S.metrics.passengers, vehicles: playerVehicles().length, companyValue: companyValue() });
  if (S.history.length > 240) S.history.shift();
}
function monthIncomeTrack(inc, exp) { S.lastIncome = inc; S.lastExpenses = exp; }

function quarterlyTick() {
  S.quarterlyIncome.push(S.qIncome); if (S.quarterlyIncome.length > 4) S.quarterlyIncome.shift(); S.qIncome = 0; S.metrics.quarterCargo = 0;
  const b = core.checkBankruptcy(S.company); S.bank = b;
  if (b === "warning") EV.addNews(S.news, S.date, "bad", "Warning: your company is running at a loss.");
  if (b === "bankrupt") { S.gameOver = true; ui.paused = true; EV.addNews(S.news, S.date, "bad", "Your company has gone bankrupt."); sound.play("crash"); }
}
function yearlyTick() {
  if (S.settings.inflation) S.inflation = core.nextInflation(S.inflation);
  S.company.maxLoan = Math.round(S.settings.maxLoan * S.inflation / 10000) * 10000;
  for (const v of S.vehicles) { v.profit.lastYear = v.profit.thisYear; v.profit.thisYear = 0; }
  EV.addNews(S.news, S.date, "info", "New year " + S.date.year + ". New vehicle models may be available.");
  sound.play("newYear");
}
function removeIndustry(id) {
  const m = S.map, i = m.industries.findIndex(x => x.id === id); if (i < 0) return;
  const ind = m.industries[i];
  for (let y = ind.y - 1; y <= ind.y + 1; y++) for (let x = ind.x - 1; x <= ind.x + 1; x++) m.occupied[y * m.w + x] = 0;
  m.industries.splice(i, 1); rebuildLookups();
}

// -------------------------------------------------------------------- building
function nameStation(kind, x, y) {
  const t = townOf(x, y);
  const n = S.stations.filter(s => s.name.startsWith(t.name)).length;
  const base = kind === "busStop" ? ["Central", "Market", "Road", "Church", "Park", "Hill"] : kind === "trainStation" ? ["Junction", "Central Station", "North Yard", "Sidings", "Halt", "Terminus"] : ["Goods Yard", "Depot Road", "Works", "Freight", "Wharf"];
  return t.name + " " + base[n % base.length] + (n >= base.length ? " " + (Math.floor(n / base.length) + 1) : "");
}
function canBuildRoadOn(x, y) {
  const m = S.map, i = key(x, y);
  if (!inB(x, y) || m.water[i]) return "Cannot build on water. Use the Bridge tool from a road end.";
  if (R.roads.hasRoad(x, y)) return "exists";
  if (m.occupied[i]) return "Something is built here.";
  return "";
}
function buildRoadTile(x, y, ownerPays = true) {
  const why = canBuildRoadOn(x, y);
  if (why === "exists") return { ok: true, cost: 0 };
  if (why) return { ok: false, reason: why };
  const i = key(x, y);
  let c = cost(ROAD_COST) + (S.map.forest[i] ? cost(CLEAR_TREE) : 0);
  if (ownerPays) { if (S.company.cash < c) return { ok: false, reason: "Not enough money." }; spend("construction", c); }
  S.map.forest[i] = 0; S.map.occupied[i] = 1; R.roads.addRoad(x, y);
  return { ok: true, cost: c };
}
function canBuildTrackOn(x, y) {
  const m = S.map, i = key(x, y);
  if (!inB(x, y) || m.water[i]) return "Cannot build track on water. Use the Bridge tool from a track end.";
  if (R.rail.hasRoad(x, y)) return "exists";
  if (R.roads.hasRoad(x, y)) return "A road is in the way. There are no level crossings yet.";
  if (m.occupied[i]) return "Something is built here.";
  return "";
}
function buildTrackTile(x, y, ownerPays = true) {
  const why = canBuildTrackOn(x, y);
  if (why === "exists") return { ok: true, cost: 0 };
  if (why) return { ok: false, reason: why };
  const i = key(x, y);
  const c = cost(TRACK_COST) + (S.map.forest[i] ? cost(CLEAR_TREE) : 0);
  if (ownerPays) { if (S.company.cash < c) return { ok: false, reason: "Not enough money." }; spend("construction", c); }
  S.map.forest[i] = 0; S.map.occupied[i] = 1; R.rail.addRoad(x, y);
  return { ok: true, cost: c };
}
function placeStation(x, y, kind, owner) {
  const rail = kind === "trainStation";
  if (!netFor(rail ? "rail" : "road").hasRoad(x, y)) return { ok: false, reason: rail ? "Build a train station on a track tile." : "Build a stop on a road tile." };
  if (R.stationAt.has(key(x, y)) || R.depotAt.has(key(x, y))) return { ok: false, reason: "There is already a building here." };
  const c = cost(rail ? RAIL_STATION_COST : STATION_COST);
  if (owner === "player") { if (S.company.cash < c) return { ok: false, reason: "Not enough money." }; spend("construction", c); }
  const s = ST.newStation("s" + (++S.ids.s), nameStation(kind, x, y), kind, x, y);
  s.owner = owner; S.stations.push(s); R.stationAt.set(key(x, y), s);
  return { ok: true, station: s, cost: c };
}
function placeDepot(x, y, dk) {
  dk = dk || "road";
  if (!netFor(dk).hasRoad(x, y)) return { ok: false, reason: dk === "rail" ? "Build a train depot on a track tile." : "Build a depot on a road tile." };
  if (R.stationAt.has(key(x, y)) || R.depotAt.has(key(x, y))) return { ok: false, reason: "There is already a building here." };
  const c = cost(dk === "rail" ? RAIL_DEPOT_COST : DEPOT_COST);
  if (S.company.cash < c) return { ok: false, reason: "Not enough money." };
  spend("construction", c);
  const d = { id: "d" + (++S.ids.d), name: townOf(x, y).name + (dk === "rail" ? " Train Depot" : " Depot"), x, y, kind: dk };
  S.depots.push(d); R.depotAt.set(key(x, y), d);
  return { ok: true, depot: d, cost: c };
}
function bulldoze(x, y) {
  const m = S.map, i = key(x, y);
  const st = R.stationAt.get(i), dp = R.depotAt.get(i);
  // A stop or depot comes off first; the road or track under it stays until the next tap.
  if (st || dp) {
    const c = cost(BULLDOZE);
    if (S.company.cash < c) return { ok: false, reason: "Not enough money." };
    spend("construction", c);
    if (st) { S.stations = S.stations.filter(s => s !== st); R.stationAt.delete(i); for (const v of S.vehicles) OR.dropStation(v.orders, st.id); }
    if (dp) { S.depots = S.depots.filter(d => d !== dp); R.depotAt.delete(i); }
    return { ok: true, removed: st ? "station" : "depot" };
  }
  if (R.roads.hasRoad(x, y)) {
    const c = cost(BULLDOZE);
    if (S.company.cash < c) return { ok: false, reason: "Not enough money." };
    spend("construction", c);
    R.roads.removeRoad(x, y);
    const sp = S.spans[i]; if (sp) delete S.spans[i];
    if (!sp || sp.kind === "tunnel") m.occupied[i] = 0; else if (!m.water[i]) m.occupied[i] = 0; else m.occupied[i] = 0;
    for (const v of S.vehicles.slice()) if (!isTrain(v) && (v.tile.x === x && v.tile.y === y || (v.state === "moving" && v.to.x === x && v.to.y === y))) removeVehicle(v);
    return { ok: true };
  }
  if (R.rail.hasRoad(x, y)) {
    const c = cost(BULLDOZE);
    if (S.company.cash < c) return { ok: false, reason: "Not enough money." };
    spend("construction", c);
    R.rail.removeRoad(x, y);
    const sp = S.spans[i]; if (sp) delete S.spans[i];
    m.occupied[i] = 0;
    for (const v of S.vehicles.slice()) if (isTrain(v) && ((v.tile.x === x && v.tile.y === y) || (v.state === "moving" && v.to.x === x && v.to.y === y))) removeVehicle(v);
    return { ok: true };
  }
  return { ok: false, reason: "Nothing to remove here." };
}
function buildCrossing(x, y) {
  const net = R.roads.hasRoad(x, y) ? R.roads : R.rail.hasRoad(x, y) ? R.rail : null;
  if (!net) return { ok: false, reason: "Tap the last road or track tile before the water or hill." };
  const spans = terrain.findCrossing(S.map, x, y, S.inflation * S.settings.cost);
  if (!spans.length) return { ok: false, reason: "No bridge or tunnel possible from here (needs the same height on the far side, max 10 tiles)." };
  const sp = spans.sort((a, b) => a.cost - b.cost)[0];
  if (S.company.cash < sp.cost) return { ok: false, reason: "A " + sp.kind + " here costs " + money(sp.cost) + ". Not enough money." };
  const dx = Math.sign(sp.endX - x), dy = Math.sign(sp.endY - y), h0 = S.map.height[key(x, y)];
  spend("construction", sp.cost);
  for (let k = 1; k <= sp.length + 1; k++) {
    const tx = x + dx * k, ty = y + dy * k, i = key(tx, ty);
    if (k <= sp.length) S.spans[i] = { kind: sp.kind, h: h0 };
    S.map.occupied[i] = 1; net.addRoad(tx, ty);
  }
  sound.play("build");
  return { ok: true, span: sp };
}

// ---------------------------------------------------------------------- rivals
function aiApi(rv) {
  const m = S.map;
  const indTiles = new Set();
  for (const i of m.industries) for (let y = i.y - 1; y <= i.y + 1; y++) for (let x = i.x - 1; x <= i.x + 1; x++) indTiles.add(y * m.w + x);
  return {
    width: m.w, height: m.h,
    tileCost(x, y) {
      const i = y * m.w + x;
      if (m.water[i]) return null;
      if (R.roads.hasRoad(x, y)) return 1;
      if (m.occupied[i] && !indTiles.has(i)) return null;
      return 8 + (m.forest[i] ? 3 : 0);
    },
    buildRoad(owner, path) {
      let n = 0;
      for (const p of path) { const i = p.y * m.w + p.x; if (!R.roads.hasRoad(p.x, p.y)) { m.forest[i] = 0; m.occupied[i] = 1; R.roads.addRoad(p.x, p.y); n++; } }
      return n * Math.round(ROAD_COST * S.inflation);
    },
    buildStation(owner, x, y) {
      const ex = R.stationAt.get(y * m.w + x); if (ex) return { id: ex.id, cost: 0 };
      const isTown = m.towns.some(t => t.x === x && t.y === y);
      const r = placeStation(x, y, isTown ? "busStop" : "truckStop", rv.ai.id);
      return r.ok ? { id: r.station.id, cost: r.cost } : null;
    },
    buyVehicle(owner, modelId, from, to) {
      const mod = V.getModel(modelId); if (!mod) return null;
      const s = stationById(from); if (!s) return null;
      const vh = makeVehicle(rv.ai.id, modelId, s, [from, to]);
      vh.cargo = mod.cargo; vh.core.breakdownsEnabled = false;
      return mod.price;
    },
  };
}

// ------------------------------------------------------------------- rendering
const cv = $("#map"), ctx = cv.getContext("2d");
const view = { x: 0, y: 0, z: 1.4 };
let dpr = 1, cssW = 300, cssH = 300;

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cssW = Math.max(100, r.width); cssH = Math.max(100, r.height);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);

  ["busStop", "Bus stop", () => "Bus stop: " + money(cost(STATION_COST)) + ". Tap a road tile near houses. Its catchment is highlighted."],
  ["truckStop", "Truck stop", () => "Truck stop: " + money(cost(STATION_COST)) + ". Tap a road tile within 3 tiles of a mine, farm, forest or factory."],
  ["depot", "Depot", () => "Depot: " + money(cost(DEPOT_COST)) + ". Tap a road tile. Vehicles are bought and serviced here."],
  ["track", "Track", () => "Railway track: " + money(cost(TRACK_COST)) + " per tile. Drag to lay track. Rails cannot cross roads yet."],
  ["trainStation", "Train station", () => "Train station: " + money(cost(RAIL_STATION_COST)) + ". Tap a track tile. Catchment is 4 tiles: place it beside a mine, forest, farm, factory or town."],

  ["bridge", "Bridge", "Tap the last road or track tile before water or a hill. A bridge or tunnel is built to the far side at the same height."],
  ["raise", "Raise land", () => "Raise land: about " + money(cost(250)) + " per tile. Neighbours follow to keep slopes gentle."],
  ["lower", "Lower land", () => "Lower land: about " + money(cost(250)) + " per tile."],

function buildToolbar() {

function setTool(id) {

  const t = TOOLS.find(x => x[0] === id); const h = typeof t[2] === "function" ? t[2]() : t[2];

// ---- status bar
function updateStatus() {
  if (!S) return;
  const d = S.date;
  $("#sdate").textContent = d.day + " " + EV.MONTH_NAMES[d.month] + " " + d.year;
  $("#scompany").textContent = "— " + S.name + " —";

// ---- input
const ptrs = new Map();
let tap = null, pinch = null, painting = false, lastPaint = null;
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener("pointerdown", e => {
  if (!S) return;
  cv.setPointerCapture(e.pointerId); const p = pos(e); ptrs.set(e.pointerId, p);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: view.z }; tap = null; painting = false; return; }
  tap = { x: p.x, y: p.y, vx: view.x, vy: view.y, moved: false, t: performance.now() };
  if (ui.tool === "road" || ui.tool === "track") { painting = true; lastPaint = null; paintAt(p); }
});
cv.addEventListener("pointermove", e => {
  const p = pos(e);

  if (!ptrs.has(e.pointerId)) { ui.hover = screenToTile(p.x, p.y); updateOverlay(); return; }
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()]; const nz = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 0.45, 3); zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, nz); return; }
  if (!tap) return;
  if (Math.hypot(p.x - tap.x, p.y - tap.y) > 6) tap.moved = true;
  if (painting) { paintAt(p); ui.hover = screenToTile(p.x, p.y); return; }
  if (tap.moved) { view.x = tap.vx + (p.x - tap.x); view.y = tap.vy + (p.y - tap.y); }
});
function endPtr(e) {

  if (tap && !tap.moved && ptrs.size === 0 && !painting) onTap(p);

}
cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("wheel", e => { e.preventDefault(); const p = pos(e); zoomAt(p.x, p.y, clamp(view.z * (e.deltaY < 0 ? 1.12 : 0.89), 0.45, 3)); }, { passive: false });
function zoomAt(sx, sy, nz) { const wx = (sx - view.x) / view.z, wy = (sy - view.y) / view.z; view.z = nz; view.x = sx - wx * nz; view.y = sy - wy * nz; }
function updateOverlay() {
  ui.overlay = null;
  const t = ui.hover; if (!t || !S) return;
  if (ui.tool === "busStop" || ui.tool === "truckStop" || ui.tool === "trainStation") ui.overlay = new Set(ST.previewCatchment(ui.tool, t.x, t.y, S.map.w, S.map.h).map(q => q.y * S.map.w + q.x));
}

  while (x !== t.x || y !== t.y) { if (Math.abs(t.x - x) >= Math.abs(t.y - y)) x += Math.sign(t.x - x); else y += Math.sign(t.y - y); pts.push({ x, y }); }

}
function onTap(p) {

  const tool = ui.tool;

  if (tool === "track") { const r = buildTrackTile(t.x, t.y); if (!r.ok) toast(r.reason, true); return; }
  if (tool === "trainStation") { const r = placeStation(t.x, t.y, "trainStation", "player"); if (!r.ok) return toast(r.reason, true); sound.play("build"); toast(r.station.name + " built."); updateOverlay(); return; }
  if (tool === "railDepot") { const r = placeDepot(t.x, t.y, "rail"); if (!r.ok) return toast(r.reason, true); sound.play("build"); toast(r.depot.name + " built."); return; }
  if (tool === "busStop" || tool === "truckStop") {
    const r = placeStation(t.x, t.y, tool, "player"); if (!r.ok) return toast(r.reason, true);
    sound.play("build"); toast(r.station.name + " built."); updateOverlay(); return;
  }
  if (tool === "depot") { const r = placeDepot(t.x, t.y); if (!r.ok) return toast(r.reason, true); sound.play("build"); toast(r.depot.name + " built."); return; }
  if (tool === "bridge") { const r = buildCrossing(t.x, t.y); if (!r.ok) return toast(r.reason, true); toast("Built a " + r.span.kind + " (" + r.span.length + " tiles) for " + money(r.span.cost) + "."); return; }

    const wagons = models.filter(w => w.type === "wagon" && w.cargo === c).sort((a, b) => a.introYear - b.introYear);

// ------------------------------------------------------------- orders editing
// Pure helpers first (tested), then the DOM editor and the fleet list.
function markServed(s, cargo) { if (!s) return; s.served[cargo] = true; if (s.daysSincePickup[cargo] == null) s.daysSincePickup[cargo] = 0; }
function resetIfCurrent(vh, i) {
  if (i === vh.orders.current && vh.state === "docked") { vh.orders.phase = "travelling"; vh.orders.dwellDays = 0; vh.state = "idle"; }
}
function setStopStation(vh, i, sid) {
  const od = vh.orders.orders[i]; if (!od || od.kind !== "stop") return false;
  const s = stationById(sid); if (!s) return false;
  od.stationId = sid; markServed(s, vh.cargo); resetIfCurrent(vh, i); return true;
}
function setStopLoad(vh, i, mode) { const od = vh.orders.orders[i]; if (!od || od.kind !== "stop" || !["auto", "full", "none"].includes(mode)) return false; od.load = mode; return true; }
function setStopUnload(vh, i, mode) { const od = vh.orders.orders[i]; if (!od || od.kind !== "stop" || !["auto", "none"].includes(mode)) return false; od.unload = mode; return true; }
function addStopTo(vh, sid, load) { const s = stationById(sid); if (!s) return false; OR.addStop(vh.orders, sid, load || "auto"); markServed(s, vh.cargo); if (vh.state === "idle" && vh.orders.orders.length === 1) vh.orders.phase = "travelling"; return true; }
function removeStop(vh, i) { if (!vh.orders.orders[i]) return false; const wasCur = i === vh.orders.current; OR.removeOrder(vh.orders, i); if (wasCur) { vh.orders.phase = "travelling"; if (vh.state === "docked") vh.state = "idle"; } return true; }
function moveOrder(vh, i, dir) {
  const o = vh.orders, j = i + dir; if (j < 0 || j >= o.orders.length) return false;
  [o.orders[i], o.orders[j]] = [o.orders[j], o.orders[i]];
  if (o.current === i) o.current = j; else if (o.current === j) o.current = i;
  return true;
}
function similarVehicles(vh) { const m = modelOf(vh); return playerVehicles().filter(v => v !== vh && v.cargo === vh.cargo && stationKindFor(modelOf(v)) === stationKindFor(m)); }
function copyOrdersToSimilar(vh) {
  const list = similarVehicles(vh);
  for (const v of list) { const n = OR.cloneOrders(vh.orders, v.id); v.orders = n; v.state = v.state === "docked" ? "idle" : v.state; for (const od of n.orders) if (od.kind === "stop") markServed(stationById(od.stationId), v.cargo); }
  return list.length;
}
function stopNote(s, cargo) {
  const p = producesAt(s, cargo), a = acceptsAt(s, cargo);
  return p && a ? "picks up and delivers " + cargo : p ? "has " + cargo + " to pick up" : a ? "accepts " + cargo : "no " + cargo + " here";
}
function orderWarnings(vh) {
  const out = OR.validate(vh.orders, id => !!stationById(id)).slice(0, 2);
  const stops = vh.orders.orders.filter(o => o.kind === "stop").map(o => ({ o, s: stationById(o.stationId) })).filter(x => x.s);
  if (stops.length >= 2) {
    if (!stops.some(x => x.o.load !== "none" && producesAt(x.s, vh.cargo))) out.push("None of these stops has " + vh.cargo + " to pick up.");
    if (!stops.some(x => x.o.unload !== "none" && acceptsAt(x.s, vh.cargo))) out.push("None of these stops accepts " + vh.cargo + ", so nothing gets paid.");
  }
  for (const x of stops) if (x.o.load === "full" && !producesAt(x.s, vh.cargo)) out.push("Full load at " + x.s.name + " will wait a long time: there is no " + vh.cargo + " there.");
  return out;
}

// Build a ready-made route: a depot, a bus stop in the two closest towns, and a road between them.
function buildDemoRoute() {
  const ts = S.map.towns.slice().sort((a, b) => b.population - a.population).slice(0, 8);
  let best = null;
  for (const a of ts) for (const b of ts) { if (a === b) continue; const d = Math.abs(a.x - b.x) + Math.abs(a.y - b.y); if (d >= 8 && d <= 40 && R.roads.connected(a, b) !== undefined) { if (!best || d < best.d) best = { a, b, d }; } }
  if (!best) return { ok: false, msg: "No suitable pair of towns on this map." };
  const { a, b } = best;
  S.company.cash += 60000;
  const ra = R.roads.nearestRoad(a.x, a.y, 6), rb = R.roads.nearestRoad(b.x, b.y, 6);
  if (!ra || !rb) return { ok: false, msg: "Towns have no roads near their centres." };
  if (!R.roads.connected(ra, rb)) {
    // lay an L-shaped road, retrying the other corner if blocked
    const tryL = (cornerFirstX) => {
      const pts = []; let x = ra.x, y = ra.y;
      if (cornerFirstX) { while (x !== rb.x) { x += Math.sign(rb.x - x); pts.push({ x, y }); } while (y !== rb.y) { y += Math.sign(rb.y - y); pts.push({ x, y }); } }
      else { while (y !== rb.y) { y += Math.sign(rb.y - y); pts.push({ x, y }); } while (x !== rb.x) { x += Math.sign(rb.x - x); pts.push({ x, y }); } }
      return pts;
    };
    for (const first of [true, false]) { for (const p of tryL(first)) buildRoadTile(p.x, p.y); if (R.roads.connected(ra, rb)) break; }
    if (!R.roads.connected(ra, rb)) return { ok: false, msg: "Could not join the towns by road (water or hills in the way). Try Bridge/Raise tools or another seed." };
  }
  let dp = null;
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0],[0,2],[0,-2]]) { const x = ra.x + dx, y = ra.y + dy; if (R.roads.hasRoad(x, y) && !R.stationAt.has(key(x, y)) && !R.depotAt.has(key(x, y))) { dp = { x, y }; break; } }
  const d1 = dp ? placeDepot(dp.x, dp.y) : placeDepot(ra.x, ra.y);
  const s1 = placeStation(ra.x, ra.y, "busStop", "player");
  const s2 = placeStation(rb.x, rb.y, "busStop", "player");
  return { ok: true, depot: d1.ok ? d1.depot : S.depots[0], s1: s1.ok ? s1.station : R.stationAt.get(key(ra.x, ra.y)), s2: s2.ok ? s2.station : R.stationAt.get(key(rb.x, rb.y)), a, b };
}
// Lay a road or track between two good spots and add a depot and two stops.
// cargo: passengers | coal | wood | grain | goods | steel.  mode: road | rail.
function spotNear(x, y, r, tx, ty) {
  const m = S.map; let best = null, bd = 1e9;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const px = x + dx, py = y + dy; if (!inB(px, py)) continue; const i = key(px, py);
    if (m.water[i] || m.occupied[i] || R.roads.hasRoad(px, py) || R.rail.hasRoad(px, py)) continue;
    const d = Math.abs(px - tx) + Math.abs(py - ty); if (d < bd) { bd = d; best = { x: px, y: py }; }
  }

}
function findEnds(cargo) {
  const m = S.map; let pairs = [];
  if (cargo === "passengers" || cargo === "mail") { const ts = m.towns.slice().sort((a, b) => b.population - a.population).slice(0, 10); for (const a of ts) for (const b of ts) if (a !== b) pairs.push([a, b, 4, 4]); }
  else {
    const from = m.industries.filter(i => CARGO_FROM_IND[i.kind] === cargo), to = m.industries.filter(i => (CARGO_TO_IND[cargo] || []).includes(i.kind));
    for (const a of from) for (const b of to) pairs.push([a, b, 2, 2]);

  }
  pairs = pairs.filter(([a, b]) => { const d = Math.abs(a.x - b.x) + Math.abs(a.y - b.y); return d >= 10 && d <= 48; }).sort((p, q) => (Math.abs(p[0].x - p[1].x) + Math.abs(p[0].y - p[1].y)) - (Math.abs(q[0].x - q[1].x) + Math.abs(q[0].y - q[1].y)));
  for (const [a, b, ra, rb] of pairs) { const sa = spotNear(a.x, a.y, ra, b.x, b.y), sb = spotNear(b.x, b.y, rb, a.x, a.y); if (sa && sb && Math.abs(sa.x - sb.x) + Math.abs(sa.y - sb.y) >= 8) return { a: sa, b: sb, from: a, to: b }; }
  return null;
}
function buildDemoLine(mode, cargo) {

  const api = { width: m.w, height: m.h, tileCost(x, y) { const i = key(x, y); if (m.water[i] || other.hasRoad(x, y)) return null; if (net.hasRoad(x, y)) return 1; if (m.occupied[i]) return null; return 4 + (m.forest[i] ? 2 : 0); } };

    assert([...sw().querySelectorAll("[data-a=wag]")].every(x => V.getModel(x.dataset.v).cargo === "wood"), "only timber wagons listed");
    sw().querySelector("[data-a=buy]").click(); const t = S.vehicles.find(v => isTrain(v)); assert(t && t.cargo === "wood", "timber train built");
    eq(t.orders.orders.length, 2, "timber train got the forest and sawmill stops"); closeAllWins();
    const out = simulateDays(300); assert(out.cargo > 0, "timber delivered by train");
  }],
  ["orders", "Editing orders: change station, full load, reorder, remove, copy", () => {
    let r; for (const seed of ["11", "12", "13", "14", "15", "16"]) { startGame({ climate: "temperate", difficulty: "easy", mapSize: 96, towns: 14, rivals: 0, startYear: 1950, seed }); r = demoLine("road", "coal", 3); if (r.ok) break; }
    assert(r && r.ok, "line");
    const vh = r.vh, [a, b] = vh.orders.orders.map(o => o.stationId);
    assert(setStopLoad(vh, 0, "full"), "full load set"); eq(vh.orders.orders[0].load, "full");
    assert(setStopUnload(vh, 0, "none"), "no unload"); eq(vh.orders.orders[0].unload, "none");
    assert(moveOrder(vh, 0, 1), "move down"); eq(vh.orders.orders[1].stationId, a, "moved");
    assert(!moveOrder(vh, 1, 1), "cannot move past the end");
    const extra = placeStation(r.line.s1.x, r.line.s1.y, "truckStop", "player"); assert(!extra.ok, "no second stop on the same tile");
    assert(addStopTo(vh, a), "add stop"); eq(vh.orders.orders.length, 3);
    assert(setStopStation(vh, 2, b), "change station"); eq(vh.orders.orders[2].stationId, b);
    assert(removeStop(vh, 2), "remove"); eq(vh.orders.orders.length, 2);
    const n = copyOrdersToSimilar(vh); eq(n, 2, "copied to the other two trucks");
    for (const v of similarVehicles(vh)) eq(v.orders.orders[1].load, "full", "copy kept full load");
    assert(orderWarnings(vh).length >= 0, "warnings run");
    setStopLoad(vh, 0, "auto"); setStopLoad(vh, 1, "full"); const out = simulateDays(200); assert(out.cargo > 0, "still delivers after editing");
  }],
  ["ui", "Fleet window, orders editor, shop with depot choice and industry window open without errors", () => {
    let r; for (const seed of ["11", "12", "13", "14", "15", "16"]) { startGame({ climate: "temperate", difficulty: "easy", mapSize: 96, towns: 14, rivals: 0, startYear: 1950, seed }); r = demoLine("rail", "coal", 1); if (r.ok) break; }
    assert(r && r.ok, "line"); demoLine("road", "coal", 1);
    fleetWin(); const fw = document.querySelector(".win[data-id=fleet]"); assert(fw && fw.querySelectorAll(".fv").length >= 2, "fleet lists vehicles");
    fw.querySelector("[data-row]").click(); assert(fw.querySelector(".oed select[data-f=load]"), "orders editor opens in the fleet list");
    const sel = fw.querySelector(".oed select[data-f=load]"); sel.value = "full"; sel.dispatchEvent(new Event("change", { bubbles: true }));
    const vid = fw.querySelector(".fv.open").dataset.v; eq(S.vehicles.find(v => v.id === vid).orders.orders[0].load, "full", "dropdown changed the order");
    closeWin("fleet");
    const dp = S.depots.find(d => d.kind === "rail"); shopWin(dp, "train"); const sw = document.querySelector(".win[data-id=shop]"); assert(sw.textContent.includes("Build at"), "shop shows which depot"); assert(!sw.querySelector("[data-a=buy]").disabled, "can buy from the depot");
    sw.querySelector("[data-a=buy]").click(); assert(S.vehicles.filter(v => isTrain(v)).length === 2, "second train bought from the depot window");
    closeAllWins(); industryWin(S.map.industries.find(i => i.kind === "factory") || S.map.industries[0]); assert(document.querySelector(".win[data-id=ind]").textContent.includes("vehicles"), "industry lists matching vehicles"); closeAllWins();
  }],
  ["fix", "Bulldozing a stop or depot leaves the road or track under it", () => {
    let r; for (const seed of ["11", "12", "13", "14", "15"]) { startGame({ climate: "temperate", difficulty: "easy", mapSize: 96, towns: 14, rivals: 0, startYear: 1950, seed }); r = buildDemoLine("rail", "coal"); if (r.ok) break; }
    assert(r && r.ok, "line");
    const s1 = r.s1, d = r.depot;
    const a = bulldoze(s1.x, s1.y); assert(a.ok && a.removed === "station", "station removed"); assert(R.rail.hasRoad(s1.x, s1.y), "track stays under the station");
    const b = bulldoze(d.x, d.y); assert(b.ok && b.removed === "depot", "depot removed"); assert(R.rail.hasRoad(d.x, d.y), "track stays under the depot");
    assert(bulldoze(s1.x, s1.y).ok && !R.rail.hasRoad(s1.x, s1.y), "second tap removes the track");
    const t = S.map.towns[0], rd = R.roads.nearestRoad(t.x, t.y, 6); S.company.cash += 9999; assert(placeStation(rd.x, rd.y, "busStop", "player").ok, "bus stop");
    bulldoze(rd.x, rd.y); assert(R.roads.hasRoad(rd.x, rd.y), "road stays under the bus stop");
  }],
  ["game", "Building tools: bridge, raise, bulldoze", () => {
    startGame({ climate: "temperate", difficulty: "easy", mapSize: 64, towns: 8, rivals: 0, startYear: 1950, seed: "5" });
    S.company.cash = 900000; let found = 0, tried = 0; const m = S.map;
    for (let y = 2; y < m.h - 2 && !found; y++) for (let x = 2; x < m.w - 2 && !found; x++) { const i = y * m.w + x; if (m.water[i] || m.occupied[i] || R.roads.hasRoad(x, y)) continue; const sp = terrain.findCrossing(m, x, y, 1); if (sp.length) { tried++; R.roads.addRoad(x, y); m.occupied[i] = 1; const r = buildCrossing(x, y); if (r.ok) found = 1; } }
    assert(found, "a crossing was built (tried " + tried + ")");
    const t = S.map.towns[0]; const rd = R.roads.nearestRoad(t.x, t.y, 6); const before = S.company.cash; const b = bulldoze(rd.x, rd.y); assert(b.ok || b.reason, "bulldoze answers");
  }],
];

function runTests(onEach) {
  const prev = { S, R, view: { ...view } }; const results = [];
  const snapUI = ui.tool;
  for (const [grp, name, fn] of TESTS) {
    const t0 = performance.now(); let ok = true, err = "";
    try { fn(); } catch (e) { ok = false; err = (e && e.message) || String(e); }
    const r = { grp, name, ok, err, ms: Math.round(performance.now() - t0) }; results.push(r); if (onEach) onEach(r);
  }
  window.__testResults = results; return results;
}

function testsWin() {
  openWin("tests", "Test panel", (body, o) => {
    body.innerHTML = "<p class='dim'>Runs every module on fresh maps. It replaces the game in progress, so save first if you care about it.</p><div class='row'></div><div class='sum' id='tsum'>Not run yet.</div><div id='tlist' class='tlist'></div>";
    const row = body.querySelector(".row"), list = body.querySelector("#tlist"), sum = body.querySelector("#tsum");
    row.appendChild(btn("Run all tests", () => {
      list.innerHTML = ""; sum.textContent = "Running…";
      setTimeout(() => {
        const res = runTests(r => { list.insertAdjacentHTML("beforeend", "<div class='t " + (r.ok ? "pass" : "fail") + "'><b>" + (r.ok ? "PASS" : "FAIL") + "</b> <span class='dim'>" + r.grp + "</span> " + r.name + (r.ok ? "" : "<div class='err'>" + r.err + "</div>") + "</div>"); });
        const bad = res.filter(r => !r.ok).length; sum.textContent = (res.length - bad) + " of " + res.length + " passed" + (bad ? ", " + bad + " failed." : ".");
        sum.className = "sum " + (bad ? "bad" : "good");
        startGame({ climate: "temperate", difficulty: "easy", mapSize: 64, towns: 10, rivals: 0, startYear: 1950, seed: "99" });
      }, 30);
    }));
    row.appendChild(btn("Build demo route", () => { const d = buildDemoRoute(); toast(d.ok ? "Built: depot, two bus stops and a road. Open the shop to buy a bus." : d.msg, !d.ok); if (d.ok) centerOn(d.a.x, d.a.y); }));
    const demo = (label, mode, cargo, n) => row.appendChild(btn(label, () => { const d = demoLine(mode, cargo, n); toast(d.ok ? label + ": built the line and bought the vehicle" + (n > 1 ? "s" : "") + ". Tap Inspect and the vehicle to see its orders." : d.msg, !d.ok); }));
    demo("Demo: coal trucks", "road", "coal", 2); demo("Demo: coal train", "rail", "coal", 1); demo("Demo: passenger train", "rail", "passengers", 1); demo("Demo: timber trucks", "road", "wood", 2);
    row.appendChild(btn("+£100,000", () => { S.company.cash += 100000; toast("Added £100,000."); }));
    row.appendChild(btn("Skip 1 year", () => { const r = simulateDays(365); toast("Year done. Cash " + (r.cash >= 0 ? "+" : "") + money(r.cash) + ", passengers " + r.pax + ", cargo " + r.cargo + "."); }));
  });
}

window.__TT_DEBUG = { get S(){return S}, get R(){return R}, runTests, buildDemoRoute, demoLine, simulateDays, startGame, buyVehicle, TESTS };
boot();
})();
